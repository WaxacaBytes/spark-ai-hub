services:
  vllm:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('openai/gpt-oss-20b')"
        # gpt-oss resolves its harmony vocab offline from this path.
        RUN mkdir -p /weights/tiktoken_encodings && python3 -c "import urllib.request; urllib.request.urlretrieve('https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken', '/weights/tiktoken_encodings/o200k_base.tiktoken')"
        FROM vllm/vllm-openai:v0.20.0-aarch64-cu130
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-gpt-oss-20b:v0.20.0-aarch64-cu130
    container_name: spark-ai-hub-vllm-gpt-oss-20b
    ports:
      - "9001:8000"
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - TIKTOKEN_ENCODINGS_BASE=/root/.cache/huggingface/tiktoken_encodings
    ipc: host
    entrypoint: ["vllm", "serve"]
    command:
      - --model
      - openai/gpt-oss-20b
      - --port
      - "8000"
      - --max-model-len
      - "131072"
      - --enable-prefix-caching
      - --kv-cache-dtype
      - fp8_e4m3
      - --gpu-memory-utilization
      - "0.19"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
