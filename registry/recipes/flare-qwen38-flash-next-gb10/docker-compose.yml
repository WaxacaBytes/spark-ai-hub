services:
  flare:
    # Qwen3.8-Flash-Next on NVIDIA Flare, the Rust local-inference server for
    # SM120/SM121 GPUs (github.com/NVIDIA/flare-local-inference), with Local
    # Inference Lab's prepared runtime package for the DGX Spark: the `gb10`
    # revision of local-inference-lab/Qwen3.8-Flash-Next-FLARE, pinned to its
    # commit cd5b8226 (qwen3.8-flash-next-gb10-tp1-c8-i4-mtp5: one GPU, up to 8
    # requests, 4 image slots, 5 MTP draft tokens). A Flare package is
    # prepared on the GPU ahead of time -- kernels tuned, forwards compiled,
    # CUDA graphs captured -- so this one ships ready and nothing compiles at
    # launch. NVFP4 routed experts with MXFP8 attention and shared experts;
    # the 26.8 GiB n-gram table is read from the image using io_uring.
    #
    # Image: ghcr.io/local-inference-lab/flare, pinned by digest (its arm64
    # build). The package is downloaded in this stage with Flare's own
    # downloader, so the build holds one copy of its 107 GB.
    #
    # License: Local Inference Lab License 1.0 -- Apache 2.0 terms plus no
    # reupload and an attribution notice. This project is based on
    # Qwen3.8-Flash-Next-FLARE by Local Inference Lab, Inc., a non-profit
    # organization, available at
    # https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-FLARE.
    # Qwen3.8-Flash-Next-FLARE is licensed under the Local Inference Lab
    # License, Version 1.0.
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/local-inference-lab/flare@sha256:d872de72dd577a28ee95313eb9dc8e3c46426068786e1e4d46db1d5fd9a18429
        USER root
        RUN mkdir -p /cache && chown flare:flare /cache
        USER flare
        RUN flare download local-inference-lab/Qwen3.8-Flash-Next-FLARE \
              --revision cd5b82260c6922d629b0d97d66d16bc4658ed2c2 --cache-dir /cache
    image: spark-ai-hub/flare-qwen38-flash-next-gb10:cd5b8226
    container_name: spark-ai-hub-flare-qwen38-flash-next-gb10
    # No published port: the Hub reaches this container by name through its
    # front door at /run/flare-qwen38-flash-next-gb10/.
    networks:
      - spark-ai-hub-net
    # Docker default policy plus only the three calls used by disk tables.
    security_opt:
      - seccomp=./seccomp-io-uring.json
    ulimits:
      # Pinned host buffers for transfers (Flare's container guide).
      memlock: -1
    configs:
      # The publisher's own profile, from the repo's main branch: offline,
      # Flare verifies the package's signature against this key.
      - source: lil_publisher
        target: /etc/flare/publisher.json
    command:
      - run
      - local-inference-lab/Qwen3.8-Flash-Next-FLARE
      - --revision
      - cd5b82260c6922d629b0d97d66d16bc4658ed2c2
      - --cache-dir
      - /cache
      - --offline
      - --gpus
      - "0"
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --served-model-name
      - Qwen/Qwen3.8-Flash-Next
      # Keep the embedding table on disk so four request slots and the full
      # context fit in shared DRAM. The seccomp profile permits its io_uring
      # reads; the table stays baked into this image, with no model volume.
      # Leave 4 GiB beyond Flare's integrated-GPU system/host allowance.
      - --memory-limit
      - "-4G"
      - --max-concurrency
      - "4"
      # This prepared package supports at most five drafts; six is rejected.
      - --mtp-draft-tokens
      - "5"
      - --embedding-table-storage
      - disk
      - --publisher-keys
      - /etc/flare/publisher.json
      - --trust-store
      - /tmp/trust.toml
      # Unattended first use: the exact publisher key (SHA-256 of the public
      # key in publisher.json) and namespace. Accepting them accepts the Local
      # Inference Lab License 1.0 the package is published under -- accepted
      # by the Spark's owner on 2026-10-22.
      - --dangerously-approve-key
      - 937c0143f6856d3ee8ad164f62e3d804bd825d7a8750d0accb9a5849f703a8c1
      - --dangerously-accept-publisher
      - local-inference-lab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, utility]
    restart: unless-stopped

configs:
  lil_publisher:
    content: |
      [{"name": "Local Inference Lab, Inc.", "namespace": "local-inference-lab", "public_key": [255, 40, 205, 49, 22, 58, 37, 174, 143, 52, 11, 7, 48, 227, 103, 28, 37, 66, 249, 163, 14, 192, 27, 219, 237, 234, 121, 58, 151, 247, 195, 125], "development": false}]

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
