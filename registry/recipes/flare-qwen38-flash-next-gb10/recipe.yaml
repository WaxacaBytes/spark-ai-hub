description: "Qwen3.8-Flash-Next on NVIDIA Flare, a Rust inference server built for DGX Spark and RTX Blackwell GPUs, running Local Inference Lab's prepared DGX Spark package: NVFP4 routed experts with MXFP8 attention and shared experts, its MTP head drafting up to five tokens a round (each verified, so output is unchanged), kernels tuned and CUDA graphs captured ahead of time so nothing compiles at launch, and the 26.8 GiB n-gram table read directly from the image on disk to preserve shared memory for context and concurrent requests. Prepared for one GPU and configured for up to 4 requests at once, with image input and tool calling. Images and ordered image frames work; direct video-file input is not supported by this runtime. Flare is a research prototype (NVIDIA's own words) released 2026-10-20. This project is based on Qwen3.8-Flash-Next-FLARE by Local Inference Lab, Inc., a non-profit organization, available at https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-FLARE. Qwen3.8-Flash-Next-FLARE is licensed under the Local Inference Lab License, Version 1.0 (Apache 2.0 terms plus no reupload)."
