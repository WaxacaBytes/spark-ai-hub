name: "Qwen3.8-Flash-Next hibrid48 NVFP4 (PLE mmap)"
slug: vllm-qwen38-flash-next-hibrid48-nvfp4-ple-mmap
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served from myllmbox's hibrid48 checkpoint on their published single-Spark vLLM 0.29 image. hibrid48 stores the output head as NVFP4: that 1.18 GiB BF16 matrix was 27% of every decode step, because MTP speculative decoding reads it about four times per step, and at 0.33 GiB it lifts engine steps from 14.4 to 17.7 per second. The 26.9 GiB PLE n-gram table ships inside the checkpoint as NVFP4 shards and is never allocated — the GPU gathers rows straight out of a memory map (GB10 unified memory), so it sits in evictable page cache instead of competing with the model. An 8 GB FP8 KV cache holds about 448K tokens at the native 262K context, with MTP K=3 decoding on FULL graphs at every seat count and async scheduling. The serving process is pinned to the Spark's ten Cortex-X925 performance cores. Vision, tool calling and reasoning all work; OpenAI-compatible API. It is a reasoning model — the chain-of-thought arrives in the reasoning field, so allow a few hundred max_tokens or the visible answer comes back empty."
