services:
  lora:
    # Angais' 16x16 pixel-art icon LoRA for MOSS-Image-Base, pinned to
    # revision c3062e09. Native MOSS-Image names (layers.N.proj.X.lora_A /
    # lora_B), rank 32, alpha 32: SGLang reads it as published.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('Angais/MOSS-Image-PixelArt-16x16', 'moss-image-pixelart-16x16.safetensors', revision='c3062e0999f33c59d985457dd290ffb00c0e28b7', local_dir='/lora')"
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-moss-image-pixelart:c3062e09
