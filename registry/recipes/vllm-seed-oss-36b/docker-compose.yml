services:
  vllm:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('ByteDance-Seed/Seed-OSS-36B-Instruct')"
        FROM vllm/vllm-openai:v0.20.0-aarch64-cu130
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-seed-oss-36b:v0.20.0-aarch64-cu130
    container_name: spark-ai-hub-vllm-seed-oss-36b
    ports:
      - "9001:8000"
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - ByteDance-Seed/Seed-OSS-36B-Instruct
      - --port
      - "8000"
      - --max-model-len
      - "200000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - seed_oss
      - --reasoning-parser
      - seed_oss
      - --enable-prefix-caching
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8_e4m3
      - --kv-cache-memory-bytes
      # 25G gave only 1.02x at 200k (dense 36B ~72GB nearly fills memory). Bump
      # toward more headroom; verified empirically (revert if it OOMs at load).
      - "32G"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
