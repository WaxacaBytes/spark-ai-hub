services:
  vllm:
    # Served on NVIDIA's NGC vLLM container (the only build with a working sm_121a
    # GDN linear-attention kernel for the Qwen3_5 hybrid arch on DGX Spark / GB10).
    # The thin local layer only hardens prometheus_fastapi_instrumentator, whose
    # route lookup otherwise 500s every request under NVIDIA's serve entrypoint.
    #
    # This recipe uses Qwen's OFFICIAL GPTQ-Int4 checkpoint, NOT the nvidia NVFP4 one.
    # The nvidia NVFP4 checkpoint is unusable on GB10: it forces fp8 KV with an
    # uncalibrated q_scale=1.0, and vLLM's fp8 attention on sm_121a yields garbage
    # ("!!!!") on every MoE backend that fits in 128 GB; the only backend that
    # re-preps the FP4 scales (marlin) spikes past 128 GB during weight repack.
    # GPTQ-Int4 has NO kv_cache scheme in its config -> default bf16 attention ->
    # coherent output, and its int4 weights (~61 GB) leave ample memory headroom.
    image: sparkforge/vllm-ngc2606-patched:local
    container_name: spark-ai-hub-vllm-qwen35-122b-a10b
    ports:
      - "9001:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    # Belt-and-suspenders: cap the container so any load-time spike is OOM-killed
    # as the container (clean exit 137) rather than thrashing the whole host.
    mem_limit: 120g
    memswap_limit: 120g
    # NGC entrypoint is nvidia_entrypoint.sh, so the command must include `vllm serve`.
    command:
      - vllm
      - serve
      - Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --quantization
      - gptq_marlin
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.8"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      # CUDA graphs (torch.compile) are left ON: on this GPTQ checkpoint they
      # capture cleanly (unlike the fp8/GDN NVFP4 path) for ~14.9 vs 14.2 tok/s.
      # If a future NGC image fails graph capture on this hybrid-GDN arch, add
      # `- --enforce-eager` here to fall back to eager mode (~14.2 tok/s, robust).
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface-cache:
