name: "Ling-3.0-tiny FP8"
slug: vllm-ling3-tiny-fp8
version: "1.0.0"
description: "inclusionAI's official FP8 build of Ling-3.0-tiny — a 7.9B-total / 1.3B-active hybrid-linear MoE (3 Kimi Delta Attention layers + 1 gated MLA layer per 4-layer block, 128 routed experts + 1 shared) with native hybrid reasoning, thinking toggled per request via enable_thinking. inclusionAI validated this exact FP8 checkpoint on the DGX Spark, quoting ~8.34 GiB peak memory at 8K context. Served on vLLM with the ling3 reasoning + tool parsers and a 256K YaRN context."
author: "inclusionAI (Ant Group)"
source: "official"
website: "https://huggingface.co/inclusionAI/Ling-3.0-tiny"
upstream: "https://huggingface.co/inclusionAI/Ling-3.0-tiny-fp8"
