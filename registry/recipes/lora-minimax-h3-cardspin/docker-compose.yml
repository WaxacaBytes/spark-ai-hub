services:
  lora:
    # MATLOWAI's CardSpin v2 (step 1500 + 50 card-spin steps: the photo turns in space like a
    # thin physical card),
    # for MiniMax-H3 Ref2VA, pinned to revision de8aa4db. Rank 32, alpha 32,
    # FP32, on every block's attn.qkv_proj, attn.out_proj, mlp.fc1 and mlp.fc2.
    #
    # It is a kohya/musubi-tuner export (lora_unet_blocks_N_attn_qkv_proj.
    # lora_down / lora_up / alpha). SGLang reads those names only from v0.5.2x
    # on; the Ref2VA bases run v0.5.19. The build stores it in the diffusers
    # names the Hub's other H3 LoRAs use, in BF16, so it loads there and
    # stacks with them; it checks that every layer's alpha is 32, which the
    # recipe passes.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into a running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('MATLOWAI/MiniMax-H3-ORB360-CardSpin', 'minimax_h3_orb360_cardspin_v2_step50.safetensors', revision='de8aa4db6f9a0d949855f3dc62948ffc691aa6ce', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, re
        from safetensors import safe_open
        from safetensors.torch import save_file
        # MiniMax-H3's native layer names -> the diffusers names the other
        # H3 LoRAs ship in (lightx2v's Turbos, Face Swap, Character Swap),
        # so the Hub can stack them on one layer. The fused qkv_proj becomes
        # to_q / to_k / to_v: the same A for each, B cut in three -- exact.
        LAYER = {"attn.qkv_proj": ["attn.to_q", "attn.to_k", "attn.to_v"], "attn.out_proj": ["attn.to_out.0"],
                 "mlp.fc1": ["ff.net.0.proj"], "mlp.fc2": ["ff.net.2"]}
        f, pairs = safe_open("/src/minimax_h3_orb360_cardspin_v2_step50.safetensors", "pt"), {}
        for key in f.keys():
            m = re.match(r"^()lora_unet_blocks_(\d+)_(attn_qkv_proj|attn_out_proj|mlp_fc1|mlp_fc2)\.(lora_down|lora_up|alpha)(?:\.weight)?$", key)
            if not m:
                raise SystemExit(key)
            refiner, block, layer, part = m.groups()
            layer = layer if "." in layer else layer.replace("_", ".", 1)
            pairs.setdefault((refiner, block, layer), {})[part[-1] if part != "alpha" else "alpha"] = f.get_tensor(key)
        out = {}
        for (refiner, block, layer), t in pairs.items():
            a, b = t.get("A", t.get("a", t.get("n"))), t.get("B", t.get("b", t.get("p")))
            assert t["alpha"].item() == 32 and a.shape[0] == 32, (block, layer)
            prefix = f"token_refiner.refiner_blocks.{block}" if refiner else f"transformer_blocks.{block}"
            names = LAYER[layer]
            for name, half in zip(names, b.chunk(len(names))):
                out[f"{prefix}.{name}.lora_A.weight"] = a.bfloat16().clone()
                out[f"{prefix}.{name}.lora_B.weight"] = half.bfloat16().contiguous()
        os.makedirs("/lora")
        save_file(out, "/lora/minimax_h3_orb360_cardspin_v2_step50.safetensors")
        print(len(pairs), "layers ->", len(out) // 2)
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-minimax-h3-cardspin:de8aa4db-diffusers
