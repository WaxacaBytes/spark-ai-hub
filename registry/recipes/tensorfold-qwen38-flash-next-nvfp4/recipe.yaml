name: "Qwen3.8-Flash-Next NVFP4"
slug: tensorfold-qwen38-flash-next-nvfp4
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's Zig engine (tensorfold-native), following Mia's AI Lab single-Spark recipe of 2026-10-18. The checkpoint is NVIDIA's quantization-aware-distilled FP4 build: NVFP4 routed experts (all 512, 10 active per token), MXFP8 attention and shared-expert linears, an FP8 n-gram table and the MTP head. Five requests at the full native 262K context share one FP8 KV pool. Decoding drafts up to six MTP tokens a round, each verified by the model, so output is unchanged. Images and videos work as OpenAI image_url / video_url parts (data URLs), as do tool calling and reasoning. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
