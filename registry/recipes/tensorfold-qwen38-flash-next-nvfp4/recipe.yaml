name: "Qwen3.8-Flash-Next NVFP4"
slug: tensorfold-qwen38-flash-next-nvfp4
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's Zig engine (tensorfold-native), following Mia's AI Lab single-Spark recipe of 2026-10-27 (TensorFold v1.1.4 with Mia's patches 0001-0017, its default checkpoint). The checkpoint is NVIDIA's quantization-aware-distilled FP4 build, trained against the bf16 model as teacher: NVFP4 routed experts (all 512, 10 active per token), MXFP8 attention and shared-expert linears, an FP8 n-gram table and the MTP head. NVIDIA's model card puts it at 91.5% GPQA Diamond and 88.7% ToolEvalBench against 92.2% and 89.4% for bf16 (read 2026-10-19); the INT4-AutoRound build of the same recipe is faster but routes 5 experts a token instead of 10, about 10% lower in general capability per its authors. Five requests at the full native 262K context share one FP8 KV pool; measured through the Hub on 2026-10-28, four and five prose requests at once ran 111.8 and 126.6 tok/s combined against 46.1 for one (the NVFP4 Video recipe, on TensorFold's previous engine, does more with several requests at once and takes video). Decoding drafts up to six MTP tokens a round, each verified by the model, so output is unchanged. Images work as OpenAI image_url parts (data URLs); this engine build takes no video. Tool calling (including tool_choice \"required\" and named functions), JSON-schema structured output and reasoning work. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
