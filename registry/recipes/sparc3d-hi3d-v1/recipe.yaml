name: "Hi3D v1.0"
slug: sparc3d-hi3d-v1
version: "1.0.0"
description: "Turn one picture of an object into a detailed, textured 3D model (GLB). Hi3D v1.0 (hi3d-official, released 2026-10-23) refines a coarse mesh into high-resolution geometry, conditioned on the picture: it samples sparse latents on the coarse shape, decodes them with a self-pruning sparse VAE and extracts the surface, at an effective grid of 1024 (two passes) by default. Built on Sparc3D and trained on about two million 3D assets, per its card. The coarse mesh comes from Tencent's Hunyuan3D-2mini Turbo, the generator Hi3D's own demo uses. Hi3D makes geometry only, so Hunyuan3D-2's paint and delight models then texture it from the same picture, on a 200,000-face copy that keeps Hi3D's surface detail (Tencent's own 40,000 turns it faceted); texture=false returns the full 1,000,000-face shape untextured. Hi3D Open License 1.0: commercial use is allowed up to 200,000 monthly users or USD 1M monthly revenue (above that a separate license); a commercial product built on it must show \"Powered by Hi3D 1.0\"; its acceptable-use schedule applies. Tested 2026-10-23 through the Hub: a sculpted head came out smooth with fine skin folds where Pixal3D's mesh of the same picture is faceted; it builds whatever the Hub's background cut leaves, so a shadow left on the backdrop becomes a sheet behind the object. With the texture step the same head came out with its eye, nose ring, teeth and lips painted in place. Hunyuan3D-2mini and Hunyuan3D-2 are under Tencent's Hunyuan Community License."
author: "hi3d-official"
source: "spark-ai-hub"
