services:
  lora:
    # UntMods' face-swap adapter for MiniMax-H3 Ref2VA (63 MB, rank 16, alpha
    # 16, trigger word "Faceswap"). Published only in ComfyUI/ai-toolkit layout
    # (diffusion_model.blocks.N.attn.qkv_proj...), which SGLang loads as a
    # silent no-op -- it would serve happily and swap no faces -- so it is
    # REKEYED here by convert_lora.py beside this file: renames, slices and a
    # row swap of the raw bytes, nothing recomputed. Validated 624/624 tensors
    # bitwise against lightx2v's own diffusers export of the same layout; this
    # adapter's shared-A QKV layout was checked separately by reconstructing
    # the fused delta (max error 0.0 across all 22 blocks).
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora, so installing it adds a few hundred MB and uninstalling it
    # removes them. Nothing of it runs. When a render asks for it, the Hub
    # copies the file into a running base model's container and switches it
    # on there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub numpy
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('UntMods/FaceSwap_MiniMaxH3_REF2VA', 'SS_FaceSwap_MiniMax_H3_REF2VA.safetensors', local_dir='/src')"
        COPY convert_lora.py /tmp/convert_lora.py
        RUN python3 /tmp/convert_lora.py /src/SS_FaceSwap_MiniMax_H3_REF2VA.safetensors \
              /lora/faceswap_ref2va_diffusers.safetensors
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-minimax-h3-faceswap:v1.0
