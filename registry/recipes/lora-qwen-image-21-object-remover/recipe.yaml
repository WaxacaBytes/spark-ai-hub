description: "An object-removal LoRA for Qwen-Image-2.1: draw a red box around something in a picture and it erases it, filling in the background and keeping shadows and the rest of the scene. Trained on 80 before/after pairs (rank 16, 4,000 steps); experimental, per its card. An add-on, not a model: install it and the Hub's image tools offer it on Qwen-Image-2.1 (edit_image with lora). Qwen-Image-2.1's license."
author: "prithivMLmods · for Qwen-Image-2.1"
source: "community"
website: "https://huggingface.co/prithivMLmods/Qwen-Image-2.1-Object-Remover-Bbox-turbo"
category: image-gen
categories:
  - image-gen
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 2
  gpu: false
