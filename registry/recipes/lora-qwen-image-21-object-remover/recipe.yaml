    - sglang-qwen-image-21
  file: "/lora/Qwen-Image-2.1-Object-Remover-Bbox-turbo-4000.safetensors"
  strength: 1.0
# The card's trigger prompt; the base model's steps.
image_defaults:
  notes: "Object removal: draw a clear red box (outline) around what should go, pass that picture as `images`, and use the card's trigger prompt: Remove the red highlighted object from the scene. The box is removed with the object. Tested 2026-10-19 on a teapot on a table (two seeds): it erased the teapot and the box cleanly; the base model alone also removes it but left a dark stain where it stood on one seed. On the other seed both turned the plain wall into a noisy texture, so try another seed when that happens."
  source: "https://huggingface.co/prithivMLmods/Qwen-Image-2.1-Object-Remover-Bbox-turbo"
