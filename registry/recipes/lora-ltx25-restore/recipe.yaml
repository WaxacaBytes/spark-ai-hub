name: "LTX-2.5 Restore IC-LoRA"
slug: lora-ltx25-restore
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: restores old or archive footage -- scratches, grain, damage and faded or missing color -- into a clean, natural-color clip of the same shot. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-restore-1.0.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Restore"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 2
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - video-restoration
  - colorization
  - archive-footage
  - ltx
weights_gb: 1.71
render_seconds: 145.4
render_workload: "4 s 16:9 old sepia film clip restored to colour, 1344x768, two-stage distilled (8 + 3 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Restore"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-restore-1.0.safetensors"
  strength: 1.0
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Restore: pass the old clip as `video` and describe the scene in plain words ending with the look you want, as the card does: a 1950s girl with blonde hair at a table drinking a glass of milk, printed dress, living room, soft window light, natural colour."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Restore"
