name: "LTX-2.5 Clean Plate IC-LoRA"
slug: lora-ltx25-clean-plate
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: removes people (or other things you name) from a clip and fills in what was behind them, keeping the camera, framing and the rest of the scene. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-clean-plate-1.0.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Clean-Plate"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - object-removal
  - vfx
  - ltx
weights_gb: 0.33
render_seconds: 142.4
render_workload: "4 s 16:9 clip with the people and dogs removed, 1344x768, two-stage distilled (8 + 3 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Clean-Plate"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-clean-plate-1.0.safetensors"
  strength: 1.0
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Clean plate: pass the clip as `video` and describe the empty scene, naming what must be gone, the card's way: An empty clean plate of the exact same scene: <describe the location and what stays>, but with no one in it. No people, no humans, no figures, and no body parts such as heads, arms, hands or legs anywhere in the frame. No cast shadows or reflections of people. Static photorealistic footage, natural light, high detail."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Clean-Plate"
