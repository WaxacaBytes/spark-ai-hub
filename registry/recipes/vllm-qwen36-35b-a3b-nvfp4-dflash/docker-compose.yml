services:
  vllm:
    # KNOWN-BROKEN as of 2026-07-01: dflash does NOT run with this checkpoint on
    # ANY vLLM image, including this nightly (0.22.1rc1.dev26+g4721bb3aa) it was
    # built for. Root cause is architectural, not a version issue: the NVIDIA
    # checkpoint bakes in an fp8 KV cache (quant_algo=FP8), but z-lab dflash's
    # drafter needs a bf16 / non-causal KV path (hence --attention-backend
    # flash_attn). vLLM requires target+drafter to share one KV-cache page size,
    # so `unify_kv_cache_spec_page_size` asserts and engine init fails.
    #   Tested images: v0.20.0/v0.22.0/v0.22.1 can't load the checkpoint
    #   (lm_head.input_scale); v0.23.0/v0.24.0 load it but hit the same page_size
    #   assertion; nightly-4721 also hits the page_size assertion.
    # The recorded tokens_per_second (101.8) appears to be unverified — this
    # config does not reach serving. Left on nightly-4721 pending investigation
    # (the drafter would need an fp8-KV-compatible path, or a bf16-KV checkpoint).
    build:
      secrets:
        - hf_token
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Qwen3.6-35B-A3B-NVFP4'); snapshot_download('z-lab/Qwen3.6-35B-A3B-DFlash')"
        FROM vllm/vllm-openai:nightly-4721bb3aa43078167eb893a9ebf9e50565030c1c
        RUN apt-get update -qq \
         && apt-get install -y --no-install-recommends git \
         && rm -rf /var/lib/apt/lists/* \
         && pip install --no-cache-dir git+https://github.com/z-lab/dflash.git \
         && pip cache purge || true
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-qwen36-35b-a3b-nvfp4-dflash:nightly-4721bb3a
    container_name: spark-ai-hub-vllm-qwen36-35b-a3b-nvfp4-dflash
    ports:
      - "9001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # NVIDIA's recommended DGX Spark (GB10, sm_121a) environment for this checkpoint.
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_FP8_MOE_BACKEND=flashinfer_cutlass
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    ipc: host
    # NVIDIA's DGX Spark serving recipe, with z-lab DFlash speculative decoding
    # (chain k=10) swapped in for the built-in MTP draft.
    command:
      - --model
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --dtype
      - auto
      - --quantization
      - modelopt
      # DFlash's drafter uses non-causal attention, which has no valid backend
      # with fp8 KV cache or FlashInfer. flash_attn handles it (default bf16 KV).
      - --attention-backend
      - flash_attn
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      # Right-sized for 1x full-256k session (leanest). Higher than the fp8 NVFP4
      # twin because flash_attn uses bf16 KV (~2x/token) plus the DFlash drafter.
      - "0.45"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "5"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      # Video: hand frame sampling back to do_sample_frames+fps (vLLM otherwise
      # applies a default frame cap and silently ignores the requested fps), and
      # allow multiple videos per prompt. Per the model card's DGX Spark recipe.
      - --media-io-kwargs
      - '{"video": {"num_frames": -1}}'
      - --limit-mm-per-prompt
      - '{"video": 4}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --speculative-config
      - '{"method": "dflash", "model": "z-lab/Qwen3.6-35B-A3B-DFlash", "num_speculative_tokens": 10}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
