name: "LTX-2.5 Water Simulation IC-LoRA"
slug: lora-ltx25-water-simulation
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: adds water to a clip -- a river, waves, rain-washed ground, flooding -- that flows with the shot while the subject and background stay as they are. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-water-simulation-0.9.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Water-Simulation"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - water-simulation
  - vfx
  - ltx
weights_gb: 0.91
render_seconds: 138.2
render_workload: "4 s 16:9 clip with heavy rain added, 1344x768, two-stage distilled (8 + 3 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Water-Simulation"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-water-simulation-0.9.safetensors"
  strength: 1.0
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Water simulation: pass the clip as `video`. The card's prompt pattern: Reference shows <the scene>. Edited shows the same scene with water added. ADD WATER <the water you want, where>. Subject identity, clothing, framing, and background geometry are identical to the reference; only water-related elements differ between reference and edited."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Water-Simulation"
