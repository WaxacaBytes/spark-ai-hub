  build_time_minutes: 5
  gpu: true
status: community-verified
engine: "vLLM"
params_b: 124
active_params_b: 5.1
arch: moe
quantization: "INT4"
weights_gb: 77.0
release_date: "2026-08-09"
requires_hf_token: false
tested_on:
  dgx_os: "7.2"
  date: "2026-08-09"
integration:
  api_url: "http://<SPARK_IP>:9001/v1"
  model_id: "inclusionAI/Ling-3.0-flash-int4"
  api_key: "not-needed"
  max_context: "262144"
  curl_example: "curl http://<SPARK_IP>:9001/v1/chat/completions -H 'Content-Type: application/json' -d '{\"model\": \"inclusionAI/Ling-3.0-flash-int4\", \"messages\": [{\"role\": \"user\", \"content\": \"Write a quicksort in Python.\"}], \"max_tokens\": 4096, \"temperature\": 0.6, \"top_p\": 0.95}'"
tokens_per_second: 36.0

