name: "Ling-3.0-flash INT4"
slug: vllm-ling3-flash-int4
version: "1.0.0"
description: "inclusionAI's official 4-bit build of Ling-3.0-flash — a 124B-total / 5.1B-active native hybrid-linear MoE (35 Kimi Delta Attention + 7 gated MLA layers, 512 experts) tuned for agentic coding and deep research. INT4 is the strongest of the official 4-bit checkpoints (GPQA-diamond 83.65 vs 82.42 for FP4), served on vLLM with the model's own NEXTN/MTP speculative head, ling3 reasoning + tool parsers, and the full 256K context."
author: "inclusionAI (Ant Group)"
source: "official"
website: "https://huggingface.co/inclusionAI/Ling-3.0-flash"
upstream: "https://huggingface.co/inclusionAI/Ling-3.0-flash-int4"
category: llm
tags:
