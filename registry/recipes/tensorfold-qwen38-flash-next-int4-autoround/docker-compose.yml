services:
  tensorfold:
    # Qwen3.8-Flash-Next on TensorFold's Zig engine (tensorfold-native, one
    # GPU), from azampatti's INT4-AutoRound checkpoint, the recipe's
    # CHECKPOINT=int4 option: GPTQ int4 routed experts (group size 128) routed
    # 5 a token instead of the model's 10 (4.8B active), an FP8 n-gram table
    # on the GPU and the MTP head.
    #
    # Recipe shape and every serving setting follow Mia's AI Lab's single-Spark
    # TensorFold recipe, pinned to commit 656879f (2026-10-18, patches 0001-
    # 0015, the NVIDIA FP4 default):
    #   https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold
    #   https://mia-ai.net/models/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold
    # The engine is their scripts/prepare.sh build, published pre-built (no
    # weights) at ghcr.io/waxacabytes/tensorfold-flashnext-spark-ai-hub from
    # github.com/WaxacaBytes/tensorfold-flashnext-spark-ai-hub: their own GHCR
    # image stops at an older patch set (zig-db28187-4144696f21e3; this
    # commit's is -c0a2df4c680d), and the recipe pulls it rather than
    # compiling it on the Spark.
    # Their start.sh / scripts/config.sh defaults are written out as plain
    # `tensorfold-native serve` flags and TENSORFOLD_* / TF_FLASHNEXT_* variables.
    build:
      context: .
      dockerfile_inline: |
        # --- engine: Mia's prepare.sh build of TensorFold's Zig engine -------
        # NVIDIA's PyTorch 26.07, Zig 0.17.0, TensorFold zig-flashnext db281878
        # with Mia's patches 0001-0015, TP=1 kernels AOT for sm_121.
        FROM ghcr.io/waxacabytes/tensorfold-flashnext-spark-ai-hub:zig-db28187-c0a2df4c680d
        # --- weights, baked in: `docker rmi` reclaims every byte -------------
        # Downloaded straight into the image's own layer (the engine image has
        # huggingface_hub), so the build never holds a second copy.
        RUN HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60 python3 -c "from huggingface_hub import snapshot_download; snapshot_download('azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound', revision='1464274120d36a4d8fcaa934552334a7d83ce0fd', local_dir='/models/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound', ignore_patterns=['.gitattributes'], max_workers=8)" && \
            rm -rf /models/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound/.cache
        WORKDIR /workspace
    image: spark-ai-hub/tensorfold-qwen38-flash-next-int4-autoround:zig-db28187-c0a2df4c680d
    container_name: spark-ai-hub-tensorfold-qwen38-flash-next-int4-autoround
    networks:
      - spark-ai-hub-net
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      # Offline: the checkpoint is in the image and served from its path.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - TENSORFOLD_NO_UPDATE_CHECK=1
      # Native 262,144-token window, no YaRN.
      - TF_FLASHNEXT_YARN=0
      # MTP: up to 6 drafts a round, verified (output matches serial decoding).
      # Mia's sweep on this checkpoint: deeper chains cost verify rows and lose
      # 5-20% at 3-5 streams; 4-8 are within noise.
      - TF_FLASHNEXT_DEPTH=6
      # The running-product confidence rule up to 5 live streams (= --parallel).
      - TF_FLASHNEXT_PRODUCT_STREAMS=5
      - TF_FLASHNEXT_PREFILL_TAIL=512
      # Patch 0014: prompt experts as a shared-memory tile kernel, bit-identical,
      # cold prefill +14% (16k prompt).
      - TF_FLASHNEXT_PROMPT_EXPERT_TILE=2
      # Image and video budgets, and the vision helper's 2 GiB workspace.
      - TENSORFOLD_MAX_IMAGES=50
      - TENSORFOLD_IMAGE_TOKENS=16384
      - TENSORFOLD_VIDEO_TOKENS=16384
      - TENSORFOLD_VISION_WORKSPACE_MIB=2048
      # MemAvailable the engine leaves free when it sizes the KV pool.
      - TENSORFOLD_MEMORY_RESERVE_GIB=10
      - PYTHONUNBUFFERED=1
    command:
      - tensorfold-native
      - serve
      - /models/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
      - --name
      - Qwen/Qwen3.8-Flash-Next
      - --host
      - "0.0.0.0"
      - --port
      - "8888"
      # The native window; five requests decoded together share one FP8 KV
      # pool (30.22 GiB after load, Mia's measurement with this checkpoint;
      # five full 262,144 windows take 21.9).
      - --context
      - "262144"
      - --parallel
      - "5"
      - --max-tokens
      - "32768"
      # Qwen's thinking-mode sampling; a request's own values win.
      - --temperature
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --thinking
      - --kv-dtype
      - fp8
      # Images and video (the model's own 0.84 GiB tower), data URLs only.
      - --vision
      - --vision-max-images
      - "50"
      - --vision-max-videos
      - "4"
      - --vision-image-tokens
      - "16384"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOT unless-stopped: the server holds most of unified memory, so a boot
    # that fails must stop instead of looping.
    restart: on-failure:1

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
