name: "Qwen3.8-Flash-Next INT4-AutoRound"
slug: tensorfold-qwen38-flash-next-int4-autoround
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's Zig engine (tensorfold-native), following Mia's AI Lab single-Spark recipe of 2026-10-18 with its CHECKPOINT=int4 option. The checkpoint is azampatti's INT4-AutoRound: GPTQ int4 routed experts (group size 128) routed 5 a token instead of the model's 10 (125B total, 4.8B active), an FP8 n-gram table on the GPU and the MTP head. Mia measured it faster than the recipe's default NVIDIA FP4 checkpoint (64.4 tok/s for one request on their Spark); its authors put it about 10% lower in general capability than the full model, where NVIDIA's FP4 QAD build stays within a point of bf16 on GPQA Diamond. Five requests at the full native 262K context share one FP8 KV pool; measured through the Hub on 2026-10-19, five prose requests at once ran 146 tok/s combined (29 each) against 51 tok/s for one. Decoding drafts up to six MTP tokens a round, each verified by the model, so output is unchanged. Images and videos work as OpenAI image_url / video_url parts (data URLs), as do tool calling and reasoning. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
author: "Qwen"
