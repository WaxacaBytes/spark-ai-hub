services:
  lora:
    # gribbliest's QMA camera-angles LoRA for Qwen-Image-2.1, pinned to
    # revision 13007eec. ai-toolkit keys (diffusion_model.transformer_blocks.
    # N.*), rank 64, all 32 blocks' attention and image MLP.
    #
    # ai-toolkit trains the image MLP's two input projections as one fused
    # layer, img_mlp.gate_up = [gate_layer; proj] (its qwen_image_2
    # transformer.py), as ComfyUI's checkpoints store it. SGLang's
    # Qwen-Image-2.1 keeps them apart, as the diffusers checkpoint does, and
    # silently skips the fused name: 32 of the LoRA's 192 layers would be
    # dropped. The build splits each one exactly (both halves keep lora_A,
    # lora_B is cut in two), so SGLang applies all 192.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running Qwen-Image-2.1 server and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('gribbliest/qwen-image-2.1-qma-camera-angles', 'qwen-image-2.1-qma-camera-angles.safetensors', revision='13007eec2648c09529e930164c2ccc9c8c12428c', local_dir='/lora')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import glob, os
        from safetensors import safe_open
        from safetensors.torch import save_file
        path = glob.glob("/lora/*.safetensors")[0]
        f = safe_open(path, "pt")
        out = {}
        for key in f.keys():
            tensor = f.get_tensor(key)
            if ".img_mlp.gate_up." not in key:
                out[key] = tensor
                continue
            gate, proj = key.replace("gate_up", "gate_layer"), key.replace("gate_up", "proj")
            if ".lora_A." in key:
                out[gate], out[proj] = tensor.clone(), tensor.clone()
            else:
                out[gate], out[proj] = (half.contiguous() for half in tensor.chunk(2))
        save_file(out, path + ".split", metadata=f.metadata())
        os.replace(path + ".split", path)
        print(len(out), "tensors")
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-qwen-image-21-qma-camera-angles:13007eec
