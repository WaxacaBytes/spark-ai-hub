name: "MiniMax-H3 Ref2VA Turbo 8-step LoRA"
slug: lora-minimax-h3-ref2va-turbo
version: "1.1.0"
description: "lightx2v's newer Ref2VA Turbo 8-step v1.1 768p LoRA for MiniMax-H3's reference-conditioning model: video with sound from pictures, a clip or a sound in 8 model passes instead of the base model's long schedule, on its own or together with another Ref2VA LoRA. An add-on, not a model: install it and the Hub's video tools offer it on its base model (generate_video with lora). Apache 2.0."
author: "lightx2v · for MiniMax-H3"
source: "community"
website: "https://huggingface.co/lightx2v/Minimax-h3-Turbo"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/minimax.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 3
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 6
  gpu: false
status: experimental
release_date: "2026-10"
engine: "SGLang"
tags:
  - lora
  - turbo
  - image-to-video
  - multi-reference
  - video-audio
  - minimax
weights_gb: 1.3
render_seconds: 863
render_workload: "5 s 16:9 clip from one reference picture, 1344x768, 9 steps, on MiniMax-H3 Ref2VA FP8"
requires_hf_token: false
# Where it loads (the first is the one it was made and measured on), and how.
lora:
  bases:
    - sglang-minimax-h3-ref2va-fp8
    - sglang-minimax-h3-ref2va-singularity-int8
  file: "/lora/minimax_h3_ref2v_turbo_8step_v1.1_768p_bf16.safetensors"
  strength: 1.0
  alpha: 8
# Settings it brings on top of its base model's.
video_defaults:
  steps: 9
  notes: "Needs a reference (picture, clip or sound), as its base does. lightx2v's Ref2V 8-step v1.1 768p adapter uses 8 transformer evaluations (steps 9 on this server). Keep the Ref2VA base model's flow shift: the publisher's shift 6 recommendation applies only to FL2V. List it with another Ref2VA LoRA (Face Swap, Character Swap, ORB360, CardSpin) to run that one in 8 steps too. Tested 2026-10-23 through the Hub on a red balloon rising over a field, seed 1234: a clean clip in 863 s; the Ref2VA 4-step made a clip as clean in 487 s."
  source: "https://huggingface.co/lightx2v/Minimax-h3-Turbo/discussions/57"
