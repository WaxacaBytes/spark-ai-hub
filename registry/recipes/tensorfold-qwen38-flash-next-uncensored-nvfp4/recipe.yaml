name: "Qwen3.8-Flash-Next Uncensored NVFP4"
slug: tensorfold-qwen38-flash-next-uncensored-nvfp4
version: "1.0.0"
description: "DevelopingDad's abliterated (refusal-removed) Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's Zig engine (tensorfold-native) with exactly the settings of the NVFP4 recipe, following Mia's AI Lab single-Spark recipe of 2026-10-27. The checkpoint is NVIDIA's quantization-aware-distilled FP4 build with the refusal direction projected out of the 48 attention output projections and the routed/shared expert down projections, re-rounded into the same NVFP4 / MXFP8 encodings, so every tensor keeps NVIDIA's layout: NVFP4 routed experts (all 512, 10 active per token), MXFP8 attention and shared-expert linears, an FP8 n-gram table and the MTP head. Its author measured 0 of 100 development and 6 of 100 holdout harmful prompts refused (NVIDIA's base: 99 and 100), first-token KL 0.21 against the base on benign prompts, and 13 of 20 writing cases passed against 14 for the base (read 2026-10-28); broad benchmarks were not run. Five requests at the full native 262K context share one FP8 KV pool; measured through the Hub on 2026-10-28, four and five prose requests at once ran 110.1 and 125.4 tok/s combined against 45.0 for one (the NVFP4 Video recipe, on TensorFold's previous engine, does more with several requests at once and takes video). Decoding drafts up to six MTP tokens a round, each verified by the model, so output is the abliterated model's own. Images work as OpenAI image_url parts (data URLs); this engine build takes no video. Tool calling (including tool_choice \"required\" and named functions), JSON-schema structured output and reasoning work. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
