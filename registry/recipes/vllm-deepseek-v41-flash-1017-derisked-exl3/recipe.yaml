description: "DeepSeek-V4.1-Flash-1017 in vcruz305 and Blackfrost-AI's DERISKED SAGE-EXL3 1.61 bpw pack. The publisher reports 94.68% assistant-turn top-1 token agreement with DeepSeek's official FP8/FP4 release; those are teacher-forced agreement figures, not benchmark scores. It runs on the same engine as the SAGE pack: vcruz305's own, rebuilt here from his recipe at 63220db (his vLLM-EXL3 and ExLlamaV3 builds with the 2-bit trellis kernel, on his published base image), with cold-expert disk mapping, Engram streaming and DSpark speculation. Text, tools and reasoning; the pack's vision path is not enabled. The 326.6 GB of weights are baked into the image for offline launch. It needs the whole Spark (about 110 GiB, nothing else running), one request at a time with a 524K-token context and answers capped at 32K tokens, and loads in about 6 minutes. Measured 2026-10-24 through the Hub: 16.3 tokens/s writing, 38.2 editing."
