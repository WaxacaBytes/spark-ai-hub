services:
  lora:
    # Pablo Dawson's 360 Orbit adapter for MiniMax-H3 FL2VA (0.16 GB, rank
    # 16, alpha 16), pinned to revision 5ddbc2db. Trained on the AdaLN-pruned
    # FL2VA DiT that sglang-minimax-h3-fp8 serves. Its keys are native H3
    # names, which SGLang maps onto its DiT as published: 208 of 264 LoRA
    # layers, exactly the card's 208 modules. An individual author's release;
    # it is the adapter's original and only source. The build stores it in
    # the diffusers names the Hub's other H3 LoRAs use, so it stacks with
    # them (a Turbo plus the orbit).
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora, so installing it adds a few hundred MB and uninstalling it
    # removes them. Nothing of it runs. When a render asks for it, the Hub
    # copies the file into a running base model's container and switches it
    # on there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('pablodawson/MiniMax-H3-360-Orbit-LoRA', 'minimax_h3_flf2v_lora_v1.safetensors', revision='5ddbc2dbbe95edbbdaf5017c3e934b1d01791697', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, re
        from safetensors import safe_open
        from safetensors.torch import save_file
        # MiniMax-H3's native layer names -> the diffusers names the other
        # H3 LoRAs ship in (lightx2v's Turbos, Face Swap, Character Swap),
        # so the Hub can stack them on one layer. The fused qkv_proj becomes
        # to_q / to_k / to_v: the same A for each, B cut in three -- exact.
        LAYER = {"attn.qkv_proj": ["attn.to_q", "attn.to_k", "attn.to_v"], "attn.out_proj": ["attn.to_out.0"],
                 "mlp.fc1": ["ff.net.0.proj"], "mlp.fc2": ["ff.net.2"]}
        f, pairs = safe_open("/src/minimax_h3_flf2v_lora_v1.safetensors", "pt"), {}
        for key in f.keys():
            m = re.match(r"^(?:diffusion_model\.)?(token_refiner\.)?blocks\.(\d+)\.(attn\.qkv_proj|attn\.out_proj|mlp\.fc1|mlp\.fc2)\.(lora_A|lora_B|lora_a|lora_b)(?:\.weight)?$", key)
            if not m:
                raise SystemExit(key)
            refiner, block, layer, part = m.groups()
            layer = layer if "." in layer else layer.replace("_", ".", 1)
            pairs.setdefault((refiner, block, layer), {})[part[-1] if part != "alpha" else "alpha"] = f.get_tensor(key)
        out = {}
        for (refiner, block, layer), t in pairs.items():
            a, b = t.get("A", t.get("a", t.get("n"))), t.get("B", t.get("b", t.get("p")))
            assert a.shape[0] == b.shape[1], (block, layer)
            prefix = f"token_refiner.refiner_blocks.{block}" if refiner else f"transformer_blocks.{block}"
            names = LAYER[layer]
            for name, half in zip(names, b.chunk(len(names))):
                out[f"{prefix}.{name}.lora_A.weight"] = a.bfloat16().clone()
                out[f"{prefix}.{name}.lora_B.weight"] = half.bfloat16().contiguous()
        os.makedirs("/lora")
        save_file(out, "/lora/minimax_h3_orbit360_diffusers.safetensors")
        print(len(pairs), "layers ->", len(out) // 2)
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-minimax-h3-orbit360:5ddbc2db-diffusers
