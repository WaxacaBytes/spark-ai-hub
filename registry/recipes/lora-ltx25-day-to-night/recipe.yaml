name: "LTX-2.5 Day-to-Night IC-LoRA"
slug: lora-ltx25-day-to-night
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: give it a daytime clip and it re-renders the same shot at night -- composition, framing, camera movement and motion kept frame for frame, only the light changes. The prompt steers the kind of night (moonlight, streetlights, color temperature). Trained on 4 s clips (97 frames at 24 fps). 0.9 checkpoint, rank 32. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora and video). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Day-To-Night"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 2
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - relighting
  - ltx
weights_gb: 0.6
render_seconds: 143.1
render_workload: "4 s 16:9 clip relit to night, 1344x768, two-stage distilled (8 + 3 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Day-To-Night"
# Only Lightricks' ICLoraPipeline feeds an IC-LoRA its reference clip;
# SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-day-to-night-0.9.safetensors"
  strength: 1.0
# Settings it brings on top of its base model's: the card's training length.
video_defaults:
  seconds: 4
  notes: "Day-to-night relighting: pass the daytime clip as `video` and describe the night you want, ending with the card's anchor sentence, e.g. A realistic nighttime scene. Warm streetlights and deep natural shadows, a starry sky. Only the lighting changes from day to night; identical composition, framing, camera movement and motion. Best on outdoor real-world shots of about 4 s (97 frames at 24 fps); longer clips can drift toward the end. Strength 1.0."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Day-To-Night"
