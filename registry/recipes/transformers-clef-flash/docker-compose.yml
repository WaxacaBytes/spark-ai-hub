services:
  clef:
    # Cloudflare's Clef-Flash decision model, served on the Jev / SystemOne
    # API (POST /v1/systemone) by server.py beside this file.
    #
    # Clef does not generate text. It reads a state (text or JSON, plus images
    # and videos) and a set of typed questions -- a choice among named options,
    # a score on an ordered scale, or a yes/no -- and returns a probability for
    # every allowed answer in one forward pass. Cloudflare ships it as weights
    # plus a reference loader (joint_schema_model.py, in the model repo) and no
    # server; no serving engine runs its decision head yet. server.py is that
    # loader behind HTTP and answers with Cloudflare's own `systemone()`.
    #
    # Weights: Cloudflare's BF16 release, the only build validated on images
    # and video. PyTorch and transformers are the versions Cloudflare tested
    # (torch 2.11, transformers 5.10.2), as the stock aarch64 CUDA 13.0 wheels.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Cloudflare/clef-flash', revision='17f0b0ad64efb65d273590632833508766b2aae6', local_dir='/models/clef-flash', ignore_patterns=['.gitattributes'], max_workers=8)"
        FROM python:3.12-slim
        # Triton, which torch uses for some ops, compiles its CUDA launcher
        # with the system C compiler the first time it runs.
        RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir --timeout 300 --retries 10 torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu130
        RUN pip install --no-cache-dir --timeout 300 --retries 10 \
              transformers==5.10.2 accelerate==1.15.0 safetensors pillow==12.3.0 av==19.0.1 \
              fastapi==0.142.2 uvicorn==0.54.0
        COPY --from=weights /models /models
        WORKDIR /app
        COPY server.py .
    image: spark-ai-hub/transformers-clef-flash:17f0b0a
    container_name: spark-ai-hub-transformers-clef-flash
    # No published port: the Hub reaches this container by name through its
    # front door at /run/transformers-clef-flash/.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - python
      - server.py
      - --model-path
      - /models/clef-flash
      - --served-model-name
      - clef-flash
      # Tokens per request for the state, the media and the questions
      # together: the context Cloudflare serves Clef with on Workers AI.
      - --max-length
      - "65536"
      # Workers AI takes at most 4 images a request; videos are local-only.
      - --max-images
      - "4"
      - --max-videos
      - "2"
      # A larger picture is scaled down to ~2 megapixels first, about 2,000
      # vision tokens; the model's own processor would take up to 16 MP.
      - --max-image-pixels
      - "2097152"
      # Video: 2 frames a second (the processor's own rate), at most 64
      # frames (longer clips are thinned evenly), each ~0.4 MP.
      - --video-fps
      - "2"
      - --max-video-frames
      - "64"
      - --max-video-frame-pixels
      - "409600"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
