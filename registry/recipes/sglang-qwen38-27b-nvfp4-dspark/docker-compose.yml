services:
  sglang:
    # Qwen3.8-27B on SGLang, served from RadixArk's NVFP4 W4A4 checkpoint
    # with the trained DSpark block drafter instead of EAGLE tree drafting.
    # Same weights as sglang-qwen38-27b-nvfp4-eagle — the speedup is decode
    # strategy, which is output-preserving. DSpark wins on math/agentic
    # coding; EAGLE wins on mixed/prose (see that recipe for the numbers).
    #
    # Image: `lmsysorg/sglang:qwen38-27b` — the named per-model tag from the
    # SGLang cookbook (arm64 manifest present). A named tag, never a rolling
    # `dev` tag, so a from-scratch reinstall keeps working.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('RadixArk/Qwen3.8-27B-NVFP4'); snapshot_download('RadixArk/Qwen3.8-27B-DSpark')"
        FROM lmsysorg/sglang:qwen38-27b
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/sglang-qwen38-27b-nvfp4-dspark:qwen38-27b
    container_name: spark-ai-hub-sglang-qwen38-27b-nvfp4-dspark
    ports:
      - "9001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      # Offline-first: both checkpoints are baked into the image above, so
      # launch never touches the network.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 32gb
    command:
      - sglang
      - serve
      - --model-path
      - RadixArk/Qwen3.8-27B-NVFP4
      - --served-model-name
      - RadixArk/Qwen3.8-27B-NVFP4
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # SM121 (GB10) has no trtllm_mha path; flashinfer is the cookbook's
      # backend for every Blackwell SM120/SM121 card.
      - --attention-backend
      - flashinfer
      # DGX Spark cell: 8192-token prefill chunks and no prefill CUDA graph.
      - --chunked-prefill-size
      - "8192"
      - --disable-prefill-cuda-graph
      # Static pool (weights + KV + Mamba/GDN state), matching the EAGLE
      # recipe's sizing: ~2x native 262K context in KV, ~55 GB left for
      # other apps.
      - --mem-fraction-static
      - "0.50"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      # DSpark: separate 2.7 GB block drafter, trained for block size 7
      # (12/16 raise acceptance to 4.6-5.8 but cost more per step and end up
      # slower — measured, not assumed).
      - --speculative-algorithm
      - "DSPARK"
      - --speculative-draft-model-path
      - "RadixArk/Qwen3.8-27B-DSpark"
      - --speculative-dspark-block-size
      - "7"
      - --speculative-draft-model-quantization
      - "unquant"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
