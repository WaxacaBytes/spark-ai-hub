name: "Qwen3.8-Flash-Next NVFP4 (PLE mmap)"
slug: vllm-qwen38-flash-next-nvfp4-ple-mmap
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served from the Mia-AiLab NVFP4 checkpoint (MXFP8 attention, 4-bit PLE table). 51B of those parameters are a PLE n-gram lookup table; here it is pre-packed at build time and memory-mapped into vLLM's CPU offload worker, so its 26.8 GiB sit in evictable page cache instead of competing with the KV pool for the Spark's single unified memory. That is what buys an FP8 KV cache holding roughly a million tokens at the native 262K context, MTP speculative decoding with FULL decode graphs at every verify width, and BF16 recurrent state. Vision, tool calling and reasoning all work; OpenAI-compatible API. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
