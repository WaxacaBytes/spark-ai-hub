services:
  atlas:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Gemma-4-31B-IT-NVFP4')"
        FROM avarok/atlas-gb10:latest
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/atlas-gemma4-31b-nvfp4:latest
    container_name: spark-ai-hub-atlas-gemma4-31b-nvfp4
    ports:
      - "9001:8888"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - serve
      - nvidia/Gemma-4-31B-IT-NVFP4
      - --bind
      - 0.0.0.0
      - --port
      - "8888"
      - --max-seq-len
      - "32768"
      - --kv-cache-dtype
      - fp8
      - --kv-high-precision-layers
      - auto
      - --gpu-memory-utilization
      - "0.90"
      - --max-batch-size
      - "1"
      - --scheduling-policy
      - slai
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --speculative
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
