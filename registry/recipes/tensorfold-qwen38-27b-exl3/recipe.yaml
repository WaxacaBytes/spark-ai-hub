name: "Qwen3.8-27B EXL3 3.0bpw DFlash2"
slug: tensorfold-qwen38-27b-exl3
version: "1.0.0"
description: "Qwen3.8-27B as turboderp's EXL3 3.00 bpw pack (6-bit head) served by TensorFold, an inference engine written for this model family, drafting with z-lab's DFlash2. The smallest weights TensorFold's upstream measured on a Spark, so each decode round reads the least memory; the drafter reads the pack's own head, and every drafted reply equals the serial decode. EXL3 support in TensorFold is marked experimental upstream. 55.9 tok/s writing, 128.2 code-edit — the fastest Qwen3.8-27B on the Hub. Images work as OpenAI image_url parts (data URLs). Native 262K context, thinking on by default, tool calling and reasoning live. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
author: "Alibaba Cloud + turboderp + z-lab"
source: "community"
website: "https://huggingface.co/turboderp/Qwen3.8-27B-exl3/tree/3.00bpw"
