name: "Qwen3.8-Flash-Next NVFP4 Video"
slug: tensorfold-qwen38-flash-next-nvfp4-video
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's previous Zig engine build (zig-flashnext db281878 with Mia's AI Lab patches 0001-0015, their single-Spark recipe of 2026-10-18), kept for video input and for throughput with several requests at once: measured through the Hub on 2026-10-28, four and five prose requests at once ran 148.6 and 168.0 tok/s combined, against 111.8 and 126.6 on the newer TensorFold v1.1.4 build (the NVFP4 recipe), which edits faster and adds JSON-schema structured output but takes no video. The checkpoint is NVIDIA's quantization-aware-distilled FP4 build, trained against the bf16 model as teacher: NVFP4 routed experts (all 512, 10 active per token), MXFP8 attention and shared-expert linears, an FP8 n-gram table and the MTP head. NVIDIA's model card puts it at 91.5% GPQA Diamond and 88.7% ToolEvalBench against 92.2% and 89.4% for bf16 (read 2026-10-19); the INT4-AutoRound build of the same recipe is faster but routes 5 experts a token instead of 10, about 10% lower in general capability per its authors. Five requests at the full native 262K context share one FP8 KV pool. Decoding drafts up to six MTP tokens a round, each verified by the model, so output is unchanged. Images and videos work as OpenAI image_url / video_url parts (data URLs), as do tool calling and reasoning. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
