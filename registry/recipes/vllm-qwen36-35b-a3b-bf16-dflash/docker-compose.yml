services:
  vllm:
    build:
      secrets:
        - hf_token
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3.6-35B-A3B'); snapshot_download('z-lab/Qwen3.6-35B-A3B-DFlash')"
        FROM vllm/vllm-openai:v0.20.0-aarch64-cu130
        RUN apt-get update -qq \
         && apt-get install -y --no-install-recommends git \
         && rm -rf /var/lib/apt/lists/* \
         && pip install --no-cache-dir git+https://github.com/z-lab/dflash.git \
         && pip cache purge || true
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-qwen36-35b-a3b-bf16-dflash:v0.20.0-aarch64-cu130
    container_name: spark-ai-hub-vllm-qwen36-35b-a3b-bf16-dflash
    ports:
      - "9001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - Qwen/Qwen3.6-35B-A3B
      - --port
      - "8000"
      - --max-model-len
      - "65536"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --gpu-memory-utilization
      # Modest trim: BF16 weights (~70 GiB) + DFlash drafter nearly fill memory,
      # so most of the reservation is load-bearing. 64k context needs little KV.
      - "0.72"
      # Bound prefill and sequence concurrency for 4-5 developer sessions so
      # one long reasoning request does not starve active decodes.
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "5"
      - --enable-prefix-caching
      - --attention-backend
      - flash_attn
      - --mm-processor-cache-type
      - shm
      - --mm-encoder-tp-mode
      - data
      - --speculative-config
      - '{"method": "dflash", "model": "z-lab/Qwen3.6-35B-A3B-DFlash", "num_speculative_tokens": 10}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
