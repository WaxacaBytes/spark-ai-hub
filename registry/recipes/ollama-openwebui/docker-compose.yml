services:
  ollama:
    image: ollama/ollama
    container_name: spark-ai-hub-ollama
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: spark-ai-hub-openwebui
    ports:
      - "8080:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434;http://172.17.0.1:11434
      # The Hub's /v1 serves every running model, and its /mcp adds image,
      # video, music and private web search as chat tools. Both take a Hub API
      # key: the Hub puts the key of whoever launches this app into
      # SAH_API_KEY, so the connection and the tool server work on first start.
      # This app therefore acts as that account: its usage is logged there and
      # what it generates is private to it.
      #
      # Where this app calls the Hub. The Hub builds every URL it prints from
      # the address it was called on, so a picture made here comes back linked
      # to whatever is in SAH_HUB_URL -- and that link is opened by a browser
      # sitting on *this app's* address, which is not the Hub's. The Hub fills
      # SAH_HUB_URL at launch with the address of whoever pressed Launch, the
      # same hostname their Open link for this app uses, so the two agree.
      #
      # This app has its own port and so can have its own tunnel, reached at
      # an address the Hub never sees. In that case write the Hub address
      # those visitors should use here, in place of ${SAH_HUB_URL:-...}, and
      # it stops following the launcher. The bridge address below is the
      # fallback for a hand-run `docker compose up`, and is reachable only
      # from inside Docker.
      - OPENAI_API_BASE_URLS=${SAH_HUB_URL:-http://172.17.0.1:9000}/v1;http://172.17.0.1:1234/v1
      - OPENAI_API_KEYS=${SAH_API_KEY:-not-needed};not-needed
      - TOOL_SERVER_CONNECTIONS=[{"url":"${SAH_HUB_URL:-http://172.17.0.1:9000}/mcp","path":"","type":"mcp","auth_type":"bearer","key":"${SAH_API_KEY:-not-needed}","config":{"enable":true},"info":{"id":"sah","name":"Spark AI Hub"}}]
      # Open WebUI copies these into its own database the first time it starts
      # and ignores the environment ever after, so an app installed months ago
      # would keep calling the Hub on the address it first got -- no setting
      # here would ever reach it. This makes the compose file the truth on
      # every start. The cost: changing one of these in Admin Settings does
      # not survive a restart, so change it here instead.
      - ENABLE_PERSISTENT_CONFIG=false
      # A tool server is listed but switched OFF in every new chat unless a
      # model carries it in meta.toolIds, and a model served over a connection
      # has no such entry — so without this the model never sees the tools.
      # Clear it in Admin Settings → Models → Default Metadata to go back to
      # per-chat toggling.
      - DEFAULT_MODEL_METADATA={"toolIds":["server:mcp:sah"]}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-data:
  openwebui-data:
