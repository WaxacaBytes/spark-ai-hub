name: "Qwen3.8-27B NVFP4 BF16 Head DFlash2 (SGLang)"
slug: sglang-qwen38-27b-nvfp4-bf16head-dflash2
version: "1.0.0"
description: "Qwen3.8-27B NVFP4 with the output projection left in BF16 instead of packed to 4-bit, served by SGLang with DFlash2. SGLang found that FP8 KV cache plus a 4-bit lm_head is where NVFP4 loses the most accuracy, and that a dense BF16 head recovers it; this recipe is that pairing. Identical engine, drafter and flags to the NVFP4 DFlash2 recipe — only the head precision changes, and it costs about 8% of the speed (27.8 vs 30.3 writing, 60.3 vs 68.3 editing, measured back-to-back on one box). Pick this one when answers matter more than tokens per second. Dense 27B hybrid Gated DeltaNet vision-language model, thinking on by default, 262K context, vision and tool calling live."
author: "Alibaba Cloud + RadixArk + Inco AI + LMSYS SGLang"
