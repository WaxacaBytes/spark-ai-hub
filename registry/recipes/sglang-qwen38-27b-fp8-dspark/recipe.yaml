name: "Qwen3.8-27B FP8 (SGLang)"
slug: sglang-qwen38-27b-fp8-dspark
version: "1.0.0"
description: "Qwen's official FP8 build of Qwen3.8-27B on SGLang, paired with the DSpark block drafter that was trained against exactly this checkpoint. The dense 27B hybrid Gated DeltaNet vision-language model — thinking on by default, 262K context, vision and tool calling live — at Qwen's own FP8 numerics. Slower than the NVFP4 sibling recipe: decode on a Spark is bandwidth-bound and FP8 weights are heavier, so DSpark's better acceptance against its native target does not pay for the extra bytes."
author: "Alibaba Cloud + RadixArk + LMSYS SGLang"
source: "community"
website: "https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8-27B"
upstream: "https://huggingface.co/Qwen/Qwen3.8-27B-FP8"
category: llm
tags:
  - llm
  - multimodal
  - vision
  - reasoning
  - coding
  - agentic
  - tool-use
  - sglang
  - qwen
  - fp8
  - speculative-decoding
logo: "/logos/qwen.png"
requirements:
  min_memory_gb: 70
  recommended_memory_gb: 80
  disk_gb: 58
  cuda_compute: "12.1"
ui:
  type: api-only
  port: 9001
  path: "/v1/models"
docker:
  build: true
  gpu: true
status: community-verified
engine: "SGLang"
params_b: 27
arch: dense
quantization: "FP8"
weights_gb: 30.2
release_date: "2026-08-12"
tokens_per_second: 17.3
requires_hf_token: false
integration:
  api_url: "http://<SPARK_IP>:9001/v1"
  model_id: "Qwen/Qwen3.8-27B-FP8"
  api_key: "not-needed"
  curl_example: "curl http://<SPARK_IP>:9001/v1/chat/completions -H 'Content-Type: application/json' -d '{\"model\": \"Qwen/Qwen3.8-27B-FP8\", \"messages\": [{\"role\": \"user\", \"content\": \"Write a quicksort in Python.\"}], \"max_tokens\": 2048, \"temperature\": 1.0, \"top_p\": 0.95}'"

