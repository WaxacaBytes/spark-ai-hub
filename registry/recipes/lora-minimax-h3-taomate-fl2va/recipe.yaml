name: "MiniMax-H3 FL2VA TaoMate LoRA"
slug: lora-minimax-h3-taomate-fl2va
version: "1.0.0"
description: "TaoLive AIGC's (Alibaba) TaoMate-H3-FL2VA LoRA for MiniMax-H3: a 3-step distillation for first/last-frame video with sound (stage 3, rank 128). Made for their own streaming runtime, which renders in small chunks; here it runs in the Hub's ordinary sampler. An add-on, not a model: install it and the Hub's video tools offer it on its base model (generate_video with lora). MiniMax-H3 Community License."
author: "TaoLive AIGC (Alibaba) · for MiniMax-H3"
source: "community"
website: "https://huggingface.co/TaoLiveAIGC/TaoMate-H3-FL2VA"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/minimax.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 3
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 6
  gpu: false
status: experimental
release_date: "2026-10"
engine: "SGLang"
tags:
  - lora
  - turbo
  - text-to-video
  - image-to-video
  - last-frame
  - video-audio
  - minimax
weights_gb: 1.2
render_seconds: 349.9
render_workload: "5 s 16:9 from a first frame, 1344x768, 4 steps, on MiniMax-H3 FL2VA FP8"
requires_hf_token: false
# Where it loads (the first is the one it was made and measured on), and how.
lora:
  bases:
    - sglang-minimax-h3-fp8
  file: "/lora/adapter_model.safetensors"
  strength: 1.0
  alpha: 128
# Settings it brings on top of its base model's.
video_defaults:
  steps: 4
  flow_shift: 12.0
  notes: "Text-to-video, or pin a first frame (image), a last frame (last_image) or both. 3 transformer evaluations (steps 4 on this server), the card's three-step schedule; the base model's shifts (video 12, audio 3). Its authors run it in their own chunked streaming runtime. List it with another FL2VA LoRA to speed that one up: with lora-minimax-h3-orbit360 a 5 s 1344x768 orbit took 361.8 s (2026-10-19; with the 8-step Turbo 928.2 s)."
  source: "https://huggingface.co/TaoLiveAIGC/TaoMate-H3-FL2VA"
