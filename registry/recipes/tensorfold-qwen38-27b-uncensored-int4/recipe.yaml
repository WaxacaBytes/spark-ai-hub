name: "Qwen3.8-27B Uncensored INT4 DFlash2"
slug: tensorfold-qwen38-27b-uncensored-int4
version: "1.0.0"
description: "OrcaRouter's abliterated (refusal-removed) Qwen3.8-27B from OrcaRouter's own MLX 4-bit build (affine INT4, groups of 64), served by TensorFold, an inference engine written for this model family, drafting with z-lab's DFlash2. The vision tower is left unquantized, so images work as OpenAI image_url parts (data URLs). The drafter was trained on the stock model; every drafted token is verified by the target, so output is the abliterated model's own. 50.3 tok/s writing, 125.3 code-edit — the fastest uncensored Qwen3.8-27B that sees images. Native 262K context, thinking on by default, tool calling and reasoning live. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
author: "Alibaba Cloud + OrcaRouter + z-lab"
source: "community"
