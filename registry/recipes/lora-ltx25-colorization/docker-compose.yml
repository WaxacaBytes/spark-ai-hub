services:
  lora:
    # Lightricks' Colorization IC-LoRA (video-to-video) for LTX-2.5, pinned to revision
    # a2b3d526.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the
    # file(s) under /lora, so installing it adds a few hundred MB and
    # uninstalling it removes them. Nothing of it runs. When a render asks for
    # it, the Hub copies it into the running LTX-2.5 engine and switches it on
    # there through /v1/set_lora (daemon/services/lora_service.py). Gated: the
    # Hub's HF token comes in as a build secret and never lands in a layer.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import hf_hub_download; [hf_hub_download('Lightricks/LTX-2.5-22b-IC-LoRA-Colorization', f, revision='a2b3d526bfe3b251ba61cdfbf93deb51eb607198', local_dir='/lora') for f in ['ltx-2.5-22b-ic-lora-colorization-0.9.safetensors']]"
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-ltx25-colorization:a2b3d526

secrets:
  hf_token:
    environment: HF_TOKEN
