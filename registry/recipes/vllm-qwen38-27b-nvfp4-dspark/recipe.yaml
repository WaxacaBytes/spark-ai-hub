name: "Qwen3.8-27B NVFP4 DSpark"
slug: vllm-qwen38-27b-nvfp4-dspark
version: "1.0.0"
description: "Qwen3.8-27B NVFP4 (Unsloth Dynamic V3.0) on vLLM with the DSpark block drafter instead of the checkpoint's MTP head. Same weights as the MTP recipe — the speedup is decode strategy, which is output-preserving. Speed depends heavily on how predictable the output is: 27.7 tok/s writing code from scratch, 58.0 editing a file that is already in the prompt (thinking off), 15.0 on open prose. Hybrid Gated DeltaNet VLM, 262K context, prefix caching on."
author: "Alibaba Cloud + Unsloth + Doopeworld"
source: "community"
website: "https://github.com/0xBakeer/Qwen3.8-27B-4-bit-on-a-single-DGX-Spark"
upstream: "https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4"
