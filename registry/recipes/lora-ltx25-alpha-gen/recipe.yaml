name: "LTX-2.5 Alpha Gen IC-LoRA"
slug: lora-ltx25-alpha-gen
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: makes an alpha matte of a clip: a black-and-white video where white is the foreground (people, animals, objects) and black the background, ready for compositing. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-alpha-gen-0.9.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Alpha-Gen"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 2
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - alpha-matte
  - matting
  - background-removal
  - vfx
  - ltx
weights_gb: 1.31
render_seconds: 726.8
render_workload: "4 s 16:9 clip to an alpha matte, 1344x768, one guided stage on the full model, on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Alpha-Gen"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-alpha-gen-0.9.safetensors"
  strength: 1.0
  pipeline: "alpha-gen"
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Alpha matte: pass the clip as `video` and a few words naming the subject as the prompt (the tool needs one; the card: No prompt required). Runs Lightricks' one-stage AlphaGenPipeline on the full LTX-2.5 model with guidance off, so it takes longer than the distilled IC-LoRAs."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Alpha-Gen"
