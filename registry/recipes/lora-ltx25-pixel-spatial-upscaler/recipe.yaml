name: "LTX-2.5 Pixel Upscaler x2 IC-LoRA"
slug: lora-ltx25-pixel-spatial-upscaler
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: upscales a clip 2x in pixel space, the detailing pass of Lightricks' production (DFR) recipe on its own. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-08"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - upscaling
  - super-resolution
  - ltx
weights_gb: 0.33
render_seconds: 206.1
render_workload: "4 s clip upscaled from 672x384 to 1344x768, one full-size stage (8 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors"
  strength: 1.0
  # Lightricks' upscaler workflow is single-stage, the reference at half size.
  pipeline: "ic-one-stage"
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Upscale x2: pass the low-resolution clip as `video` (672x384 for the default 1344x768 output; same shot, framing and length) and describe the scene briefly. It re-renders the scene at twice the size and invents fine detail rather than copying pixels: the card's flow is a draft at about 280p first, then this. Not for compressed or degraded footage (use Decompression or Restore), nor where faithful detail matters."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler"
