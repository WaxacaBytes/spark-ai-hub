services:
  vllm:
    build:
      context: .
      dockerfile_inline: |
        FROM vllm/vllm-openai:v0.20.0-aarch64-cu130
        RUN apt-get update -qq \
         && apt-get install -y --no-install-recommends wget ca-certificates \
         && rm -rf /var/lib/apt/lists/* \
         && mkdir -p /app \
         && wget -q -O /app/nano_v3_reasoning_parser.py https://huggingface.co/nvidia/NVIDIA-Nemotron-Labs-3-Elastic-30B-A3B-NVFP4/raw/main/nano_v3_reasoning_parser.py
    image: spark-ai-hub/vllm-nemotron3-elastic-30b-a3b-nvfp4:v0.20.0-aarch64-cu130
    container_name: spark-ai-hub-vllm-nemotron3-elastic-30b-a3b-nvfp4
    ports:
      - "9001:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - nvidia/NVIDIA-Nemotron-Labs-3-Elastic-30B-A3B-NVFP4
      - --served-model-name
      - nvidia/NVIDIA-Nemotron-Labs-3-Elastic-30B-A3B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "262144"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "384"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.26"
      - --reasoning-parser-plugin
      - /app/nano_v3_reasoning_parser.py
      - --reasoning-parser
      - nano_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface-cache:
