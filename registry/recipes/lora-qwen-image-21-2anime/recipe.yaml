name: "Qwen-Image-2.1 2Anime LoRA"
slug: lora-qwen-image-21-2anime
version: "1.0.0"
description: "An image-to-anime LoRA for Qwen-Image-2.1 by NicknickAI: give it a photo and the trigger 2anime, and it redraws the picture in anime style, keeping the people, pose and composition. Rank 16, 4,000 steps. An add-on, not a model: install it and the Hub's image tools offer it on Qwen-Image-2.1 (edit_image with lora). Qwen Research License (non-commercial)."
author: "NicknickAI · for Qwen-Image-2.1"
source: "community"
website: "https://huggingface.co/NicknickAI/QwenImage2.1-2anime"
category: image-gen
categories:
  - image-gen
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 2
  gpu: false
status: experimental
release_date: "2026-10"
engine: "SGLang"
tags:
  - lora
  - image-edit
  - anime
  - style-transfer
  - qwen
weights_gb: 0.08
render_seconds: 60
render_workload: "one 1024x1024 photo-to-anime edit, 40 steps, CFG 1, on Qwen-Image-2.1"
requires_hf_token: false
# Where it loads (the first is the one it was made and measured on), and how.
lora:
  bases:
    - sglang-qwen-image-21
  file: "/lora/2anime-qwen-image-2.1.safetensors"
  strength: 1.0
  alpha: 16
# The card's settings: weight 1, CFG 1 (its 8 steps assume a speed-up; the base model's steps here).
image_defaults:
  true_cfg_scale: 1.0
  notes: "Photo to anime: pass the picture as `images` and put the trigger 2anime in the prompt, e.g. 2anime, convert this photo to anime style. Weight 1, CFG 1 per its card. Tested 2026-10-21 on a studio portrait and a photo (woman with dogs), seeds 1-3: the base model alone already turns photos into a warm, semi-realistic illustration; the LoRA gives a classic anime look instead (larger eyes, soft pale palette, blush) while keeping pose and composition. A style choice rather than a fix."
  source: "https://huggingface.co/NicknickAI/QwenImage2.1-2anime"
