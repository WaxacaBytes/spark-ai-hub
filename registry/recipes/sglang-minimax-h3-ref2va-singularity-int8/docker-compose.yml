services:
  sglang:
    # MiniMax-H3 Singularity V2 (WarmBloodAban), a full fine-tune of
    # MiniMax-H3's reference-conditioning (Ref2VA) DiT -- HDR-trained, sharper
    # distant faces, more fluid action, stronger prompt adherence, fixed audio
    # reference -- in INT8 ConvRot, served by SGLang Diffusion on the OpenAI
    # videos API exactly like sglang-minimax-h3-ref2va-int8-turbo: same
    # image, same MiniMax configs, VAEs and Comfy-Org NVFP4 text encoder; only
    # the DiT file is Singularity's.
    #
    # The file is the unpruned INT8 ConvRot layout of Comfy-Org's
    # minimax_h3_ref2va_int8_convrot.safetensors: the same 1,035 tensors, I8
    # weights with U8 rotations and F32 scales. Two differences, both in the
    # header: its names carry ComfyUI's model.diffusion_model. prefix, and it
    # has no `config` metadata, which Comfy-Org's file carries. The build
    # rewrites the header only -- prefix dropped, Comfy-Org's config copied in
    # -- and streams the 34 GB of tensor data across unchanged.
    #
    # Not step-distilled: its card recommends a Turbo LoRA for fast renders;
    # lora-minimax-h3-ref2va-turbo (lightx2v's 8-step Ref2VA Turbo) loads into
    # it like into the stock Ref2VA build.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('MiniMaxAI/MiniMax-H3', local_dir='/models/MiniMax-H3', allow_patterns=['model_index.json', 'modular_model_index.json', 'LICENSE', 'Ref2VA/*'], ignore_patterns=['Ref2VA/transformer/*.safetensors', 'Ref2VA/text_encoder/*.safetensors', 'Ref2VA/*.index.json'])"
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Comfy-Org/MiniMax-H3', local_dir='/models/comfy', allow_patterns=['text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors'])"
        # Singularity V2's INT8 DiT, to /src: only its rewritten copy below
        # reaches the image.
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('WarmBloodAban/Minimax-h3_Singularity', 'Minimax-h3_Singularity_ref2va_v2_int8.safetensors', revision='a56850c870825d6a8ae501a595c4dbbbc77bbc7e', local_dir='/src')"
        # Comfy-Org's own unpruned INT8 file, header only (range reads): its
        # `config` metadata goes into Singularity's header.
        RUN python3 - <<'PY'
        import json, os, struct, urllib.request
        url = "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/e5eb578a89295337b8ff433a035929ce0279e0b6/diffusion_models/minimax_h3_ref2va_int8_convrot.safetensors"
        def get(a, b):
            return urllib.request.urlopen(urllib.request.Request(url, headers={"Range": f"bytes={a}-{b}"}), timeout=300).read()
        n = struct.unpack("<Q", get(0, 7))[0]
        comfy = json.loads(get(8, 8 + n - 1))
        src = "/src/Minimax-h3_Singularity_ref2va_v2_int8.safetensors"
        with open(src, "rb") as f:
            m = struct.unpack("<Q", f.read(8))[0]
            head = json.loads(f.read(m))
            meta = head.pop("__metadata__", {}) or {}
            renamed = {k.removeprefix("model.diffusion_model."): v for k, v in head.items()}
            missing = set(comfy) - {"__metadata__"} - set(renamed)
            extra = set(renamed) - set(comfy)
            assert not missing and not extra, (sorted(missing)[:5], sorted(extra)[:5])
            meta["config"] = comfy["__metadata__"]["config"]
            out_head = json.dumps({"__metadata__": meta, **renamed}).encode()
            out_head += b" " * (-len(out_head) % 8)
            os.makedirs("/models/singularity")
            with open("/models/singularity/minimax_h3_singularity_ref2va_v2_int8_convrot.safetensors", "wb") as o:
                o.write(struct.pack("<Q", len(out_head)) + out_head)
                while chunk := f.read(1 << 26):
                    o.write(chunk)
        print(len(renamed), "tensors renamed; config metadata copied from Comfy-Org")
        PY
        FROM lmsysorg/sglang:v0.5.19-cu130
        # INT8 ConvRot weights are decoded by comfy-kitchen's kernels, which
        # SGLang's image does not ship (its cookbook states the requirement).
        # Installed at BUILD time from the published aarch64 wheel -- nothing
        # is compiled and nothing is fetched at launch, so the offline-launch
        # guarantee holds.
        RUN pip install --no-cache-dir comfy-kitchen==0.2.35 \
         && python3 -c "import comfy_kitchen; print('comfy_kitchen ok')"
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-minimax-h3-ref2va-singularity-int8:a56850c8
    container_name: spark-ai-hub-sglang-minimax-h3-ref2va-singularity-int8
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-minimax-h3-ref2va-singularity-int8/, so it never collides
    # with the LLM or with another media model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # LoRA add-ons (lora-* recipes) load into this model while it runs, and
      # SGLang wraps the dynamic LoRA forward in @torch.compile, which fails on
      # this image's torch ("'torch.Stream' object has no attribute
      # 'cuda_stream'"). Disabling TorchDynamo runs that forward eagerly;
      # SGLang's own --enable-torch-compile is off by default anyway.
      - TORCHDYNAMO_DISABLE=1
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      # The repo root (its name is what SGLang's registry matches);
      # --model-variant picks the Ref2VA partition inside it.
      - --model-path
      - /models/MiniMax-H3
      - --model-variant
      - ref2va
      - --component-weights-paths.transformer
      - /models/singularity/minimax_h3_singularity_ref2va_v2_int8_convrot.safetensors
      - --component-weights-paths.text_encoder
      - /models/comfy/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default. On the
      # Spark CPU and GPU share the same memory, so offload only adds copies
      # back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are only for fast CPU<->GPU transfer, which
      # unified memory never needs; pinning would lock memory for nothing.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
