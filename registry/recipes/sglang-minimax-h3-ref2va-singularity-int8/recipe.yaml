name: "MiniMax-H3 Ref2VA Singularity INT8"
slug: sglang-minimax-h3-ref2va-singularity-int8
version: "1.0.0"
description: "Generate video with a matching soundtrack from a reference with Singularity V2, WarmBloodAban's full fine-tune of MiniMax-H3's reference-conditioning (Ref2VA) model: trained further on HDR video for clearer frames and less motion blur, sharper faces in medium and long shots, more natural skin and materials, more fluid action and fight scenes, stronger prompt adherence, and a fixed audio-reference path. Same inputs as stock Ref2VA: pictures, a clip and a sound as references, named in the prompt, plus an optional last frame. Not step-distilled; add the Ref2VA Turbo LoRA for 8-step renders, as its card recommends. Unpruned INT8 ConvRot DiT with Comfy-Org's NVFP4 text encoder, about 59 GB of weights. Served by SGLang Diffusion; your coding agents reach it through the Hub's video tools (generate_video / get_video). Apache 2.0 on the fine-tune; MiniMax-H3 Community License on the base."
author: "MiniMax · fine-tune by WarmBloodAban"
source: "community"
website: "https://huggingface.co/WarmBloodAban/Minimax-h3_Singularity"
upstream: "https://github.com/sgl-project/sglang/blob/main/docs/cookbook/diffusion/MiniMax/MiniMax-H3.mdx"
category: video-gen
categories:
  - video-gen
tags:
  - openai-videos
  - image-to-video
  - multi-reference
  - audio-reference
  - last-frame
  - video-edit
  - video-audio
  - minimax
  - sglang
  - int8
  - fine-tuned
icon: "\U0001F3AC"
logo: "/logos/minimax.png"
requirements:
  min_memory_gb: 64
  recommended_memory_gb: 121
  disk_gb: 100
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP video tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-minimax-h3-ref2va-singularity-int8/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 45
  gpu: true
status: experimental
release_date: "2026-10"
engine: "SGLang"
# MiniMax's card: H3-Omni-Transformer is a 33B dense transformer (~13B of it in AdaLN
# branches, which inference can precompute).
params_b: 33
quantization: "INT8"
# The checkpoint partition this build serves (MiniMax-H3 ships two).
variant: "Ref2VA"
prompt_guide: "minimax-h3-ref2va"
weights_gb: 58.9
render_seconds: 741
render_workload: "5 s 16:9 clip from one reference picture, 1344x768, with the Ref2VA Turbo LoRA (8 passes)"
requires_hf_token: false
# Ref2VA takes its reference INSIDE extra_params.conditions, as a URI -- SGLang
# states that the generic top-level upload fields are not lowered into H3
# conditions. The Hub's video service sees the `conditions` list below and puts
# the picture or clip the caller passed into it as a base64 data URI, which
# SGLang materializes server-side. `conditions` must therefore stay a list here.
#
# Timing and canvas come only from extra_params.target (768 short edge, 4-15 s
# at 24 fps); fps, num_frames and guidance are rejected.
#
# 8 denoising passes, the count PulpCut recommends and measured against. NOT 4:
# the pruned ComfyUI conversion of the turbo adapter drops all 51 AdaLN adapter
# pairs, and its own metadata warns four-step behaviour is degraded as a result.
# SGLang counts sigma grid points including the terminal zero, so 8 passes are
# requested as num_inference_steps 9. Shift 6 / audio shift 3 are lightx2v's
# settings for the 8-step 768p distillation that is merged in here.
video_defaults:
  seconds: 5
  flow_shift: 12.0
  extra_params:
    task: "ref2va"
    conditions: []
    target:
      short_edge: 768
      aspect_ratio: "16:9"
      duration_seconds: 5.0
    audio_flow_shift: 3.0
  aspect_ratios: ["16:9", "9:16", "21:9", "4:3", "1:1", "3:4"]
  max_seconds: 15
  notes: "Needs a reference: a picture or a clip, never text alone. 768p short edge at 24 fps; clips run 4-15 s, per the model card; shift 12 from the checkpoint's scheduler config. Its card asks for the subject, action, setting, camera and an explicit style (photorealistic, East Asian realism, 3D CG or cinematic CG) in prompts under about 5,000 characters; with lora-minimax-h3-ref2va-turbo it renders in 8 passes. References: a clip (video), pictures (image, then images), a sound (audio); name them in the prompt as <Video 1>, <Picture 1>, <Picture 2>, <Audio 1>. A last_image is pinned as the final frame on top of the references. Shapes 21:9, 16:9, 4:3, 1:1, 3:4 or 9:16. Tested 2026-10-22 against stock Ref2VA FP8, both with the Ref2VA Turbo LoRA, same reference picture, prompt (sword forms in a bamboo courtyard) and seed: Singularity rendered in 741 s against 834 s, with longer, more readable sword swings and flowing robes; both drifted from the reference face toward the scene."
  source: "https://huggingface.co/WarmBloodAban/Minimax-h3_Singularity"
