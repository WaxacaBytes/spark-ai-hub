services:
  vllm:
    # AEON-7's uncensored Qwen3.8-27B, quantized to NVFP4 W4A4 (group 16) by
    # sakamakismile with llm-compressor. The smallest of the three Qwen3.8-27B
    # NVFP4 builds in the hub at 20.6 GB -- everything is 4-bit except lm_head,
    # the vision tower, the DeltaNet conv1d and the MTP head, which stay bf16 --
    # against RadixArk's 21.9 GB and Blackfrost's 30.3 GB.
    #
    # Image: vLLM's named `qwen38-arm64-cu130` release tag, the same build the
    # `vllm-qwen38-27b-nvfp4` recipe runs on. A named tag, not a `nightly-<sha>`:
    # those get garbage-collected from Docker Hub within about a day, which would
    # break a clean from-scratch reinstall.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        # HF_HUB_DOWNLOAD_TIMEOUT: without it a socket that goes quiet mid-shard
        # blocks the whole download forever instead of failing and resuming.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights HF_HUB_DOWNLOAD_TIMEOUT=30
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('sakamakismile/Qwen3.8-27B-AEON-ULTIMATE-UNCENSORED-NVFP4')"
        FROM vllm/vllm-openai:qwen38-arm64-cu130
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-qwen38-27b-aeon-ultimate-nvfp4:qwen38-arm64-cu130
    container_name: spark-ai-hub-vllm-qwen38-27b-aeon-ultimate-nvfp4
    ports:
      - "9001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # DGX Spark (GB10, sm_121a) flashinfer environment.
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    ipc: host
    command:
      - --model
      - sakamakismile/Qwen3.8-27B-AEON-ULTIMATE-UNCENSORED-NVFP4
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --dtype
      - auto
      # No --quantization flag: compressed-tensors nvfp4-pack-quantized is
      # auto-detected, per the model card.
      #
      # ONE DELIBERATE DEVIATION FROM THE MODEL CARD: the card serves with
      # `--kv-cache-dtype fp8`, but this checkpoint's quantization_config sets
      # "kv_cache_scheme": null and it ships no k_scale/v_scale tensors, so fp8
      # KV would run on an uncalibrated scale of 1.0. That is the exact path that
      # makes the nvidia Qwen3.5-122B NVFP4 checkpoint emit garbage on sm_121a.
      # The default (model dtype) KV is both correct and free here. Measured both
      # ways on this Spark: fp8 KV is coherent and worth +4% (19.3 vs 18.5 tok/s),
      # which is not enough to justify an uncalibrated quantization of the KV
      # cache. Add `--kv-cache-dtype fp8` here if you want the 4% and the smaller
      # KV pool back.
      - --gpu-memory-utilization
      # ~20.6 GiB of NVFP4 weights plus a bf16 KV pool. Leaves the Spark ample
      # room for other services while holding several full-context sessions.
      - "0.45"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # The 15 bf16 mtp.* modules are listed in quantization_config.ignore and
      # must stay that way -- if vLLM quantizes the draft head the acceptance
      # rate collapses to zero and MTP ends up slower than no MTP at all. This
      # checkpoint's MTP is the qwen3_5_mtp method, not the generic "mtp".
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN
