name: "Qwen-Image-2.1 Turbo"
slug: sglang-qwen-image-21-turbo
version: "1.0.0"
description: "Qwen-Image-2.1 in 4 steps: Viggle's DMD-distilled student of Qwen's 7B DiT, a full BF16 fine-tune that replaces the stock transformer, with Qwen's own Qwen3-VL 8B text encoder and VAE unchanged. 4 transformer passes instead of 40, with no classifier-free guidance. Viggle calls it a v0.1 preview: text-to-image is usable, but editing with several references, face swaps and edits that must keep a person's identity are clearly worse than the 40-step base — for those, use Qwen-Image-2.1. Served by SGLang Diffusion on the OpenAI images API; your coding agents reach it through the Hub's image tools (generate_image / edit_image). Everything stays resident on the GPU at BF16. Qwen Research License (non-commercial)."
author: "Qwen (Alibaba) · 4-step distillation by Viggle"
source: "community"
website: "https://huggingface.co/Viggle/Qwen-Image-2.1-viggle-turbo"
upstream: "https://huggingface.co/Qwen/Qwen-Image-2.1"
category: image-gen
categories:
  - image-gen
tags:
  - openai-images
  - text-to-image
  - image-edit
  - qwen
  - diffusion
  - sglang
  - turbo
  - distilled
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  min_memory_gb: 48
  recommended_memory_gb: 64
  disk_gb: 60
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP image tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-qwen-image-21-turbo/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 25
  gpu: true
status: experimental
release_date: "2026-09"
engine: "SGLang"
params_b: 7
arch: dense
quantization: "BF16"
weights_gb: 30.9
requires_hf_token: false
# The Hub's image tools use these whenever an agent leaves them unset.
# The student was distilled for exactly 4 steps with CFG off; Viggle's card
# says more steps or CFG do not help.
image_defaults:
  steps: 4
  true_cfg_scale: 1.0
  notes: "Distilled for exactly 4 steps at CFG 1 (off) with no negative prompt; more steps or CFG do not help. Editing was trained with 1-3 reference images. RGBA output is untested at 4 steps."
  source: "https://huggingface.co/Viggle/Qwen-Image-2.1-viggle-turbo"
integration:
  api_url: "<HUB>/v1"
  model_id: "Qwen-Image-2.1-Turbo"
  api_key: "<API_KEY>"
  curl_example: "curl <HUB>/v1/images/generations -H 'Authorization: Bearer <API_KEY>' -H 'Content-Type: application/json' -d '{\"model\": \"Qwen-Image-2.1-Turbo\", \"prompt\": \"A neon shop sign that reads QWEN IMAGE 2.1, rainy night, reflections on wet pavement\", \"size\": \"1024x1024\"}'"
