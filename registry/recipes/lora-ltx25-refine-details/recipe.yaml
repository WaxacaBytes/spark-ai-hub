name: "LTX-2.5 Refine Details IC-LoRA"
slug: lora-ltx25-refine-details
version: "1.0.0"
description: "Lightricks' official IC-LoRA (video-to-video) for LTX-2.5: re-renders a clip with finer detail -- sharper textures, faces, foliage, text -- keeping the shot and motion. Trained by Lightricks on LTX-2.5-22B; ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors. An add-on, not a model: install it and the Hub's video tools offer it on LTX-2.5 on Lightricks' pipelines (generate_video with lora). LTX-2.x Community License."
author: "Lightricks"
source: "community"
website: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Refine-Details"
category: video-gen
categories:
  - video-gen
icon: "\U0001F3AC"
logo: "/logos/lightricks.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 2
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 3
  gpu: false
status: experimental
release_date: "2026-09"
engine: "LTX-Pipelines"
tags:
  - lora
  - ic-lora
  - video-edit
  - video-enhancement
  - detail-refinement
  - ltx
weights_gb: 1.31
render_seconds: 144.4
render_workload: "4 s 16:9 soft 672x384 clip refined, 1344x768, two-stage distilled (8 + 3 steps), on LTX-2.5 Distilled (LTX-Pipelines)"
requires_hf_token: true
# Lightricks gates each LoRA repo separately ("Agree and Access").
gated_repos:
  - "Lightricks/LTX-2.5-22b-IC-LoRA-Refine-Details"
# Lightricks' own pipelines run it; SGLang's LTX-2.5 takes no clip.
lora:
  bases:
    - ltxpipelines-ltx25-bf16
  file: "/lora/ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors"
  strength: 1.0
# Settings it brings on top of its base model's.
video_defaults:
  seconds: 4
  notes: "Refine details: pass the clip as `video` and describe it with the detail you want, the card's way: <shot and scene>, deep focus, photoreal, 8K, sharp photographic detail, crisp faces and clothing texture, natural grain, high resolution footage."
  source: "https://huggingface.co/Lightricks/LTX-2.5-22b-IC-LoRA-Refine-Details"
