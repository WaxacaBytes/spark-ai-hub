services:
  metaview-lightning:
    build: .
    image: metaview-lightning-spark-ai-hub:local
    container_name: spark-ai-hub-metaview-lightning
    ports:
      - "7872:7860"
    environment:
      PORT: "7860"
      OUTPUT_DIR: "/data/output"
      # All model repos are hardcoded in app.py (a Gradio app), so the Hub's
      # command parsers can't discover them. Declare them here so install-time
      # prefetch pulls them into the cache volume (online) before the container
      # is ever launched offline. `repo|pat|pat` restricts the download to the
      # files the app actually loads — the two Qwen repos are huge and we only
      # need a subset of each; the Lightning repo holds 100+ GB of variants but
      # the app loads one named file.
      SPARK_PREFETCH_HF_REPOS: >-
        Kwai-Kolors/MetaView,
        depth-anything/DA3-GIANT-1.1,
        depth-anything/DA3NESTED-GIANT-LARGE-1.1,
        Qwen/Qwen-Image-Edit|transformer/|processor/,
        Qwen/Qwen-Image|text_encoder/|vae/|tokenizer/,
        lightx2v/Qwen-Image-Lightning|Qwen-Image-Edit-Lightning-8steps-V1.0.safetensors
      HF_HOME: "/root/.cache/huggingface"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      # Avoid xet's parallel chunk cache (~2x transient disk during download).
      HF_HUB_DISABLE_XET: "1"
      # Force diffsynth's attention onto torch SDPA — no flash_attn / xformers
      # in the image (aarch64), and every diffsynth path falls back to SDPA.
      DIFFSYNTH_ATTENTION_IMPLEMENTATION: "torch"
      # diffsynth defaults to ModelScope; force the Hugging Face cache instead.
      DIFFSYNTH_DOWNLOAD_SOURCE: "huggingface"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - metaview-lightning-cache:/root/.cache/huggingface
      - metaview-lightning-output:/data/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  metaview-lightning-cache:
  metaview-lightning-output:
