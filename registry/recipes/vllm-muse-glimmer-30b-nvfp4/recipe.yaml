name: "Muse Glimmer 30B NVFP4"
slug: vllm-muse-glimmer-30b-nvfp4
version: "1.0.0"
description: "Red Hat AI's NVFP4 (4-bit) build of Meta's Muse Glimmer 30B — a dense multimodal agentic model with a 1.8B ViT-G/14 perception encoder, distilled from Muse Spark for autonomous tool use, reasoning, and failure recovery on local hardware. Served on vLLM's dedicated Muse Glimmer image with muse_glimmer tool + reasoning parsing. ~2.5x smaller than BF16, 128K context. Reasoning model: allow 2000+ max_tokens or the visible answer comes back empty (the chain-of-thought arrives in `reasoning`)."
author: "Meta + Red Hat AI"
source: "official"
website: "https://huggingface.co/RedHatAI/Muse-Glimmer-30B-NVFP4"
upstream: "https://huggingface.co/RedHatAI/Muse-Glimmer-30B-NVFP4"
