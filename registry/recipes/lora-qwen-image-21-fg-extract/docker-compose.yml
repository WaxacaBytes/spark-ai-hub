services:
  lora:
    # trmz's FG Extract LoRA v4 for Qwen-Image-2.1, pinned to revision
    # 09a01962. Rank 32, alpha folded into B, attention and image MLP of all
    # 32 blocks, already in diffusers names (transformer.transformer_blocks...,
    # gate_layer and proj apart), which SGLang reads as published. Trained on
    # a 4-step distilled Qwen-Image-2.1 with CFG off.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('trmz/qwen-image-2.1-fg-extract-lora', 'qwen-image-2.1-fg-extract-v4.safetensors', revision='09a019626d162657fcf8322de3a93de554c3e0a7', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, torch
        from safetensors import safe_open
        from safetensors.torch import save_file
        f = safe_open("/src/qwen-image-2.1-fg-extract-v4.safetensors", "pt")
        out = {}
        for key in f.keys():
            t = f.get_tensor(key).to(torch.bfloat16)
            out[key.replace(".default.weight", ".weight")] = t
        os.makedirs("/lora", exist_ok=True)
        save_file(out, "/lora/qwen-image-2.1-fg-extract-v4.safetensors")
        print(len(out), "tensors")
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-qwen-image-21-fg-extract:09a01962
