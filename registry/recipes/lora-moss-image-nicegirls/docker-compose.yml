services:
  lora:
    # Danrisi's NiceGirls v2 for MOSS-Image Base, pinned to revision 0528bc1c.
    # ai-toolkit, rank 16 (alpha = rank), FP16, attention and MLP of 41 of
    # the 42 layers, in ComfyUI names.
    #
    # ai-toolkit trains the attention input as one fused qkv projection; the
    # MOSS-Image graph SGLang runs keeps q, k and v apart. The build splits
    # it exactly (the same A for each, B cut in three), drops ComfyUI's
    # diffusion_model. prefix and stores BF16 like the other MOSS LoRAs.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('Danrisi/nicegirls_v2_moss', 'nicegirls_v2_moss.safetensors', revision='0528bc1cdd08a18dc4158cfa1c0f8e4e29c96d8b', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, torch
        from safetensors import safe_open
        from safetensors.torch import save_file
        f = safe_open("/src/nicegirls_v2_moss.safetensors", "pt")
        out = {}
        for key in f.keys():
            t = f.get_tensor(key).to(torch.bfloat16)
            key = key.removeprefix("diffusion_model.")
            if ".proj.qkv." not in key:
                out[key] = t
                continue
            names = [key.replace(".proj.qkv.", f".proj.{p}.") for p in "qkv"]
            if ".lora_A." in key:
                for name in names:
                    out[name] = t.clone()
            else:
                for name, part in zip(names, t.chunk(3)):
                    out[name] = part.contiguous()
        os.makedirs("/lora", exist_ok=True)
        save_file(out, "/lora/nicegirls-v2-moss.safetensors")
        print(len(out), "tensors")
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-moss-image-nicegirls:0528bc1c
