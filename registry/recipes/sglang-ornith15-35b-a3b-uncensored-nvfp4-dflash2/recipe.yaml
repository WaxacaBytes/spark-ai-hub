version: "1.0.0"
description: "The uncensored Ornith-1.5-35B-A3B — ressl's abliterated NVFP4 master, the same checkpoint the vLLM build serves — moved onto SGLang so it can use jzinno's DFlash2 block-diffusion drafter. The vLLM build has no speculative decoding available to it at all: the ModelOpt export drops the checkpoint's MTP head, and vLLM's n-gram proposer silently empties tool-call arguments. DFlash2 is a real drafter with real weights, measured by its author on a DGX Spark at +44% over target-only decoding against the stock Ornith NVFP4 — and it reproduces here on the abliterated weights it was never trained against: 64.8 tok/s writing against the vLLM build's 37.9, and 198.7 on code edits, where block-diffusion drafting has the most to copy. That is faster than the stock censored NVFP4 recipe on both counts. Refusal behaviour is inherited from the same abliterated master: hard refusals 586/1120 down to 20/1120 across five red-team datasets, GPQA-Diamond 58.6% against the base model's 61.1%. 262K context, reasoning and tool calling live. Removes safety refusals the upstream model was trained to have; supply your own guardrails."
