name: "Qwen-Image-2.1 BFS Head Swap LoRA"
slug: lora-qwen-image-21-bfs-head-swap
version: "1.0.0"
description: "A head-swap LoRA for Qwen-Image-2.1: give it a photo and a second picture of a person, and it puts that person's head (face, hair, eye colour, nose) on the photo's body, keeping the photo's head angle, gaze, expression, lighting and background. V1.1, the card's recommended version (less skin softening than V1). An add-on, not a model: install it and the Hub's image tools offer it on Qwen-Image-2.1 (edit_image with lora). MIT. Use only with the consent of the people shown."
author: "Alissonerdx · for Qwen-Image-2.1"
source: "community"
website: "https://huggingface.co/Alissonerdx/BFS-Best-Face-Swap"
category: image-gen
categories:
  - image-gen
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  # Nothing of it runs: the memory is its base model's.
  min_memory_gb: 0
  disk_gb: 1
  cuda_compute: "12.1"
ui:
  # No server and no page: the Hub loads it into a running base model.
  type: none
docker:
  build: true
  build_time_minutes: 2
  gpu: false
status: experimental
release_date: "2026-10"
engine: "SGLang"
tags:
  - lora
  - image-edit
  - face-swap
  - qwen
weights_gb: 0.26
render_seconds: 71.3
render_workload: "one 1376x768 picture with the head from a second picture, 40 steps, CFG 1, on Qwen-Image-2.1"
requires_hf_token: false
lora:
  bases:
    - sglang-qwen-image-21
  file: "/lora/bfs_head_v1.1_qwen_2.1.safetensors"
  strength: 1.0
# The card's workflow: strength 1.0, the base model's steps.
image_defaults:
  notes: "Head swap: pass two pictures as `images`, in this order: the photo to change first (its body, pose, light and background stay), then the person whose head goes in. The card's prompt: head_swap: start with <image1> as the base image, keeping its lighting, environment, and background. remove the head from <image1> completely and replace it with the head from <image2>, strictly preserving the hair, eye color, nose structure from <image2>. copy the direction of the eye, head rotation, micro expressions from <image1>, high quality, sharp details, 4k. Reversing the pictures swaps the other way. Use only with the consent of the people shown. Tested 2026-10-19 on a photo (woman with dogs, terrace) and a studio portrait: the new head kept the photo's head angle, gaze and smile, its body, light and background; the base model alone pasted the portrait's front-facing head and re-posed her."
  source: "https://huggingface.co/Alissonerdx/BFS-Best-Face-Swap/blob/main/docs/qwen-image-2.1.md"
