services:
  lora:
    # AIImageStudio's RadianceChromeVoluptuous v1.0 for Qwen-Image-2.1,
    # pinned to revision fb69407a. PEFT keys (.lora_A.default.weight), rank
    # 32, attention and image MLP of all 32 blocks, gate_layer and proj
    # apart; the build only drops PEFT's ".default" so SGLang finds them.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('AIImageStudio/RadianceChromeVoluptuous_QwenImage2.1_v1.0', 'RadianceChromeVoluptuous_QwenImage2.1_v1.0.safetensors', revision='fb69407a27ed768cc31fcf1a3a383f4bbe7eeb59', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, torch
        from safetensors import safe_open
        from safetensors.torch import save_file
        f = safe_open("/src/RadianceChromeVoluptuous_QwenImage2.1_v1.0.safetensors", "pt")
        out = {}
        for key in f.keys():
            t = f.get_tensor(key).to(torch.bfloat16)
            out[key.replace(".default.weight", ".weight")] = t
        os.makedirs("/lora", exist_ok=True)
        save_file(out, "/lora/radiance-chrome-voluptuous-v1.0.safetensors")
        print(len(out), "tensors")
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-qwen-image-21-radiance-chrome:fb69407a
