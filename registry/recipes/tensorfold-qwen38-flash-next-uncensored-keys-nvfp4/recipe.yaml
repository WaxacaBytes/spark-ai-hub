version: "1.0.0"
description: "Mia's AI Lab ABLIT=1 build of Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold's Zig engine (tensorfold-native) on Mia's own published engine image, following Mia's single-Spark recipe of 2026-10-30 (TensorFold v1.1.4 with Mia's patches 0001-0017) with exactly the settings of the NVFP4 recipe. The checkpoint is NVIDIA's quantization-aware-distilled FP4 build with drowzeys's Keys \"house-qsa\" abliteration overlay grafted in: self_attn.o_proj of the 12 attention layers (L3 to L47) comes from a ~190 MB sidecar, requantized to MXFP8 after a rank-1 refusal-direction projection; every expert (NVFP4, all 512, 10 active per token), the MTP head, the n-gram table, vision and the chat template stay NVIDIA's. Mia's own checks of this build (2026-10-30): it boots and answers /health; no exactness, needle or refusal run on it yet, and the overlay author's refusal32 32/32 was taken on the vLLM recipe. Spot-checked through the Hub on 2026-10-31: it answered 3 of 3 borderline prompts (lock picking, a phishing email, toxic gas mixtures), read an image and made a required tool call; not a controlled evaluation, and no stock baseline was taken. Five requests at the full native 262K context share one FP8 KV pool; measured through the Hub on 2026-10-31, four and five prose requests at once ran 129.2 and 146.1 tok/s combined against 51.5 for one. Decoding drafts up to six MTP tokens a round, each verified by the model, so output is the abliterated model's own. Images work as OpenAI image_url parts (data URLs); this engine build takes no video. Tool calling (including tool_choice \"required\" and named functions), JSON-schema structured output and reasoning work. The overlay is gated on Hugging Face (free, approved automatically once its Responsible Use Agreement is accepted), so the install needs an HF token of that account. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
