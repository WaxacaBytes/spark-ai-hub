services:
  lora:
    # Gogodr's 360 panorama edit LoRA for Qwen-Image-2.1 (pano360_qwen21_edit_v1),
    # pinned to revision fe3f3d07. ai-toolkit, rank 32 (alpha = rank), attention
    # and image MLP of all 32 blocks, in ComfyUI names
    # (diffusion_model.transformer_blocks...).
    #
    # ai-toolkit trains the image MLP's two input projections as one fused
    # layer, img_mlp.gate_up = [gate_layer; proj]. SGLang's Qwen-Image-2.1
    # keeps them apart and silently skips the fused name, so the build splits
    # each one exactly (both halves keep lora_A, lora_B is cut in two).
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('Gogodr/qwen-image-2.1-edit-pano360-lora', 'pano360_qwen21_edit_v1.safetensors', revision='fe3f3d07c842a5f3afd03b7cf4329e30e2e0ef89', local_dir='/src')"
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
         && pip install --no-cache-dir safetensors numpy
        RUN python3 <<'PY'
        import os, torch
        from safetensors import safe_open
        from safetensors.torch import save_file
        f = safe_open("/src/pano360_qwen21_edit_v1.safetensors", "pt")
        out = {}
        for key in f.keys():
            t = f.get_tensor(key).to(torch.bfloat16)
            key = key.replace(".default.weight", ".weight")
            if ".img_mlp.gate_up." not in key:
                out[key] = t
                continue
            gate, proj = key.replace("gate_up", "gate_layer"), key.replace("gate_up", "proj")
            if ".lora_A." in key:
                out[gate], out[proj] = t.clone(), t.clone()
            else:
                out[gate], out[proj] = (half.contiguous() for half in t.chunk(2))
        os.makedirs("/lora", exist_ok=True)
        save_file(out, "/lora/pano360_qwen21_edit_v1.safetensors")
        print(len(out), "tensors")
        PY
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-qwen-image-21-pano360:fe3f3d07
