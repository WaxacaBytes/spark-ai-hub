services:
  lora:
    # lightx2v's FL2VA Turbo 8-step v1.0 768p LoRA for MiniMax-H3 (rank 128,
    # alpha 8 in its metadata, diffusers names), pinned to revision a29e57d1:
    # on MiniMax-H3 FL2VA FP8 it renders byte-identical to the old full Turbo
    # recipe (removed 2026-10-19), and it stacks with the other FL2VA LoRAs.
    #
    # A LoRA recipe holds the adapter and nothing else: the image is the file
    # under /lora. Nothing of it runs. When a render asks for it, the Hub
    # copies it into the running base model's container and switches it on
    # there through SGLang's /v1/set_lora (daemon/services/lora_service.py).
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('lightx2v/Minimax-h3-Turbo', 'minimax_h3_fl2v_turbo_8step_v1.0_768p_bf16.safetensors', revision='a29e57d195f80ead07c89f89e55ecf2911e893c5', local_dir='/lora')"
        FROM scratch
        COPY --from=weights /lora /lora
    image: spark-ai-hub/lora-minimax-h3-turbo:a29e57d1
